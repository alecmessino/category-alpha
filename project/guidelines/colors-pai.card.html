<!-- @dsCard group="Colors" viewport="700x150" name="PAI lifecycle phases" subtitle="Behavioral phase colors — never rename the phases" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-app);font-family:var(--font-mono);padding:18px}
.row{display:flex;gap:10px}.s{flex:1}.sw{height:56px;border-radius:6px;display:flex;align-items:flex-end;padding:7px;color:#fff;font-size:10px;font-weight:700;letter-spacing:.5px}
.n{font-size:9.5px;color:var(--ink-600);margin-top:6px}</style></head>
<body><div class="row">
<div class="s"><div class="sw" style="background:var(--pai-accumulation)">ACCUMULATION</div><div class="n">--pai-accumulation · #10b981</div></div>
<div class="s"><div class="sw" style="background:var(--pai-velocity)">VELOCITY</div><div class="n">--pai-velocity · #f59e0b</div></div>
<div class="s"><div class="sw" style="background:var(--pai-exhaustion)">EXHAUSTION</div><div class="n">--pai-exhaustion · #ef4444</div></div>
<div class="s"><div class="sw" style="background:var(--pai-watch)">WATCH</div><div class="n">--pai-watch · #8b5cf6</div></div>
</div></body></html>
