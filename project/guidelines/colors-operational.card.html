<!-- @dsCard group="Colors" viewport="700x180" name="Operational neutrals" subtitle="Light terminal chrome — paper, ink, lines" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-app);font-family:var(--font-mono);padding:18px}
.row{display:flex;gap:8px}.s{flex:1}.sw{height:70px;border-radius:6px;border:1px solid var(--line-200)}
.n{font-size:10px;color:var(--ink-900);margin-top:6px;font-weight:600}.h{font-size:9.5px;color:var(--ink-600)}</style></head>
<body><div class="row">
<div class="s"><div class="sw" style="background:var(--white)"></div><div class="n">--white</div><div class="h">#ffffff</div></div>
<div class="s"><div class="sw" style="background:var(--paper-50)"></div><div class="n">--paper-50</div><div class="h">#f8fafc</div></div>
<div class="s"><div class="sw" style="background:var(--paper-100)"></div><div class="n">--paper-100</div><div class="h">#f4f5f8</div></div>
<div class="s"><div class="sw" style="background:var(--line-200)"></div><div class="n">--line-200</div><div class="h">#e2e8f0</div></div>
<div class="s"><div class="sw" style="background:var(--line-300)"></div><div class="n">--line-300</div><div class="h">#cbd5e1</div></div>
<div class="s"><div class="sw" style="background:var(--ink-400)"></div><div class="n">--ink-400</div><div class="h">#94a3b8</div></div>
<div class="s"><div class="sw" style="background:var(--ink-600)"></div><div class="n">--ink-600</div><div class="h">#475569</div></div>
<div class="s"><div class="sw" style="background:var(--ink-900)"></div><div class="n">--ink-900</div><div class="h">#0f172a</div></div>
</div></body></html>
