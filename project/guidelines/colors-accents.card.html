<!-- @dsCard group="Colors" viewport="700x180" name="Operational accents" subtitle="Restricted high-trust palette: cyan, green, red, amber, violet" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-app);font-family:var(--font-mono);padding:18px}
.row{display:flex;gap:8px;flex-wrap:wrap}.s{flex:1;min-width:64px}.sw{height:64px;border-radius:6px;border:1px solid var(--line-200)}
.n{font-size:9.5px;color:var(--ink-900);margin-top:6px;font-weight:600}.h{font-size:9px;color:var(--ink-600)}</style></head>
<body><div class="row">
<div class="s"><div class="sw" style="background:var(--cyan-500)"></div><div class="n">--cyan-500</div><div class="h">#0ea5e9</div></div>
<div class="s"><div class="sw" style="background:var(--cyan-400)"></div><div class="n">--cyan-400</div><div class="h">#38bdf8</div></div>
<div class="s"><div class="sw" style="background:var(--green-600)"></div><div class="n">--green-600</div><div class="h">#16a34a</div></div>
<div class="s"><div class="sw" style="background:var(--green-400)"></div><div class="n">--green-400</div><div class="h">#34d399</div></div>
<div class="s"><div class="sw" style="background:var(--red-600)"></div><div class="n">--red-600</div><div class="h">#dc2626</div></div>
<div class="s"><div class="sw" style="background:var(--red-500)"></div><div class="n">--red-500</div><div class="h">#ef4444</div></div>
<div class="s"><div class="sw" style="background:var(--amber-700)"></div><div class="n">--amber-700</div><div class="h">#b45309</div></div>
<div class="s"><div class="sw" style="background:var(--amber-500)"></div><div class="n">--amber-500</div><div class="h">#f59e0b</div></div>
<div class="s"><div class="sw" style="background:var(--violet-600)"></div><div class="n">--violet-600</div><div class="h">#7c3aed</div></div>
<div class="s"><div class="sw" style="background:var(--radioactive)"></div><div class="n">--radioactive</div><div class="h">#39ff14</div></div>
</div></body></html>
