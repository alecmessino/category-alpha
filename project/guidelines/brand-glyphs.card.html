<!-- @dsCard group="Brand" viewport="700x150" name="Operational glyphs" subtitle="Unicode icon vocabulary — no icon font, no emoji" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-app);padding:20px;font-family:var(--font-mono);display:flex;gap:20px;flex-wrap:wrap}
.g{display:flex;flex-direction:column;align-items:center;gap:6px}
.gy{font-size:22px;color:var(--ink-900)}.n{font-size:9px;color:var(--ink-600)}</style></head>
<body>
<div class="g"><span class="gy">◉</span><span class="n">info</span></div>
<div class="g"><span class="gy" style="color:var(--amber-500)">▲</span><span class="n">rising</span></div>
<div class="g"><span class="gy" style="color:var(--red-600)">▼</span><span class="n">falling</span></div>
<div class="g"><span class="gy" style="color:var(--green-600)">✓</span><span class="n">confirmed</span></div>
<div class="g"><span class="gy">➤</span><span class="n">tracking</span></div>
<div class="g"><span class="gy">≈</span><span class="n">climatology</span></div>
<div class="g"><span class="gy">❚❚</span><span class="n">pause</span></div>
<div class="g"><span class="gy">▶</span><span class="n">play</span></div>
<div class="g"><span class="gy">◀◀</span><span class="n">step-back</span></div>
<div class="g"><span class="gy">▶▶</span><span class="n">live</span></div>
<div class="g"><span class="gy">↻</span><span class="n">reset</span></div>
</body></html>
