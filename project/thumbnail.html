<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0}
  .tile{width:1280px;height:854px;display:flex;font-family:var(--font-display)}
  .main{flex:1;background:var(--slate-925);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
  .main svg{width:300px;height:300px}
  .wm{display:flex;align-items:baseline;gap:14px}
  .wm .a{font-family:var(--font-display);font-weight:700;font-size:104px;color:#e6edf6;letter-spacing:1px}
  .wm .b{font-family:var(--font-sans);font-weight:700;font-size:104px;color:#38bdf8;letter-spacing:2px}
  .strip{width:150px;display:flex;flex-direction:column}
  .strip>div{flex:1}
</style></head>
<body>
<div class="tile">
  <div class="main">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
      <defs><linearGradient id="cyg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00F0FF"/><stop offset="100%" stop-color="#0066FF"/>
      </linearGradient></defs>
      <polygon points="40,5 75,22 75,57 40,75 5,57 5,22" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
      <path d="M40 20 C55 20, 60 35, 40 45 C20 55, 25 70, 40 70" fill="none" stroke="url(#cyg)" stroke-width="5" stroke-linecap="round"/>
      <polyline points="20,50 35,35 48,42 62,20" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="62" cy="20" r="4.5" fill="#f59e0b"/>
    </svg>
    <div class="wm"><span class="a">Category</span><span class="b">Alpha</span></div>
  </div>
  <div class="strip">
    <div style="background:#38bdf8"></div>
    <div style="background:#f59e0b"></div>
    <div style="background:#16a34a"></div>
    <div style="background:#dc2626"></div>
  </div>
</div>
</body></html>
