/* tokens/colors.css */
/* Category Alpha — Color System
   Two real surfaces coexist in Millibar Terminal:
   (1) the LIGHT operational chrome (default), and
   (2) the DARK tactical "Storm Command Center" (data-surface="tactical").
   Base values are literal hues from the codebase; semantics are in semantic.css. */
:root{
  /* ---- tactical neutrals (dark command surfaces) ---- */
  --slate-950:#04060c;   /* map stage / deepest */
  --slate-925:#05070d;   /* command shell bg */
  --slate-900:#070b14;   /* command card / rail */
  --slate-850:#0b1220;   /* sunken dark */
  --graphite-800:#10192b;/* dark hairline / metric grid */
  --graphite-700:#1a2740;/* dark control border */
  --graphite-600:#1e293b;/* command outer border */

  /* ---- operational neutrals (light chrome) ---- */
  --ink-900:#0f172a;     /* primary text / solid buttons */
  --ink-700:#334155;
  --ink-600:#475569;     /* muted text */
  --ink-400:#94a3b8;
  --line-300:#cbd5e1;    /* strong hairline / scrollbar */
  --line-200:#e2e8f0;    /* default hairline */
  --paper-50:#f8fafc;    /* sunken panel */
  --paper-100:#f4f5f8;   /* app background */
  --white:#ffffff;       /* card */

  /* ---- operational accents (restricted, high-trust) ---- */
  --cyan-500:#0ea5e9;    /* primary accent (light) */
  --cyan-400:#38bdf8;    /* primary accent (dark) / live edge */
  --blue-600:#0066ff;    /* logo gradient terminus */
  --blue-300:#7fb2e6;    /* command brand text */
  --green-600:#16a34a;   /* positive / BUY (light) */
  --green-500:#10b981;   /* accumulation phase */
  --green-400:#34d399;   /* positive / LIVE (dark) */
  --red-600:#dc2626;     /* negative / SELL (light) */
  --red-500:#ef4444;     /* exhaustion / negative (dark) */
  --amber-700:#b45309;   /* warn (light) */
  --amber-500:#f59e0b;   /* velocity phase */
  --amber-400:#fbbf24;   /* warn / REPLAY (dark) */
  --violet-600:#7c3aed;  /* special / watch (light) */
  --violet-500:#8b5cf6;  /* watch phase (dark) */
  --radioactive:#39ff14; /* extreme-edge glow only (edge >= 15%) */

  /* ---- PAI lifecycle phase colors (behavioral states) ---- */
  --pai-accumulation:#10b981;
  --pai-velocity:#f59e0b;
  --pai-exhaustion:#ef4444;
  --pai-watch:#8b5cf6;
}

/* tokens/typography.css */
/* Category Alpha — Typography scale.
   Three families: Erode (serif display, brand wordmark), Satoshi (sans, UI),
   IBM Plex Mono (all telemetry: timestamps, prices, ids, latencies, versions). */
:root{
  --font-display:'Erode',Georgia,serif;
  --font-sans:'Satoshi','Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;

  /* mono telemetry sizes */
  --fs-mono-xs:9.5px;   /* micro-footers, kind tags */
  --fs-mono-sm:10.5px;  /* HUD, chip labels */
  --fs-mono-md:11.5px;  /* map stats, timestamps */
  --fs-mono-lg:13px;    /* metric values, inputs */

  /* sans UI sizes */
  --fs-label:10px;      /* uppercase section labels */
  --fs-caption:11px;
  --fs-body:12.5px;
  --fs-title:16px;      /* card / storm names */
  --fs-stat:24px;       /* hero stat numbers */
  --fs-hero:26px;       /* command rail storm name */

  /* weights */
  --fw-reg:500; /* @kind other */
  --fw-bold:700; /* @kind other */
  --fw-black:800; /* @kind other */

  /* tracking */
  --track-mono:.3px;
  --track-label:.6px;
  --track-caps:1px;
  --track-brand:2.5px;

  /* line-height */
  --lh-tight:1.05; /* @kind other */
  --lh-body:1.5; /* @kind other */
}

/* tokens/spacing.css */
/* Category Alpha — Spacing, radii, borders.
   Bloomberg-density: tight, non-4/8-grid values lifted verbatim from the codebase. */
:root{
  --sp-1:3px;
  --sp-2:5px;
  --sp-3:7px;
  --sp-4:9px;
  --sp-5:11px;
  --sp-6:14px;
  --sp-7:18px;
  --sp-8:24px;

  --pad-card:14px;       /* stormcard / sigcard */
  --pad-cell:10px 12px;  /* edge-matrix cell */
  --pad-panel-hd:12px 16px;

  --radius-sm:6px;       /* tags, chips, controls */
  --radius-md:8px;       /* cards, panels */
  --radius-lg:12px;      /* stat tiles, intel cards */
  --radius-pill:999px;

  --bw-hair:1px;
  --bw-accent:3px;       /* section-header left rule */
  --bw-signal:4px;       /* signal-card left rule */
}

/* tokens/effects.css */
/* Category Alpha — Motion & effects.
   Motion signals LIVE data state, not decoration. No bounces, no easing flourishes.
   Fast .15s transitions; a slow status pulse; a cinematic camera dip. */
:root{
  --ease-ui:.15s; /* @kind other */
  --ease-cam:.18s; /* @kind other */
  --dur-veil:.2s; /* @kind other */
  --dur-drawer:.25s; /* @kind other */

  --glow-edge:0 0 8px rgba(57,255,20,.5);          /* extreme-edge number */
  --glow-accent:0 0 0 1px rgba(56,189,248,.35),0 6px 18px -8px rgba(56,189,248,.6);
  --ring-focus:0 0 0 1px rgba(56,189,248,.4);
}
/* live status pulse — the single sanctioned "live feed" animation */
@keyframes ca-pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.6)}70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
@keyframes ca-reticle{0%{transform:scale(.62);opacity:.9}70%{transform:scale(1.5);opacity:0}100%{opacity:0}}
@keyframes ca-spin{to{transform:rotate(360deg)}}

/* tokens/semantic.css */
/* Category Alpha — Semantic aliases.
   DEFAULT scope = light operational terminal chrome.
   [data-surface="tactical"] remaps surfaces to the dark Storm Command Center.
   Components must reference these, never the raw base tokens. */
:root{
  --surface-app:var(--paper-100);
  --surface-card:var(--white);
  --surface-sunken:var(--paper-50);
  --surface-solid:var(--ink-900);      /* solid button / active tab */
  --border-dim:var(--line-200);
  --border-strong:var(--line-300);
  --border-accent:var(--cyan-500);

  --text-1:var(--ink-900);             /* primary */
  --text-2:var(--ink-600);             /* muted / metadata */
  --text-inverse:var(--white);
  --text-link:var(--cyan-500);

  --accent:var(--cyan-500);
  --accent-bright:var(--cyan-400);
  --pos:var(--green-600);              /* BUY / fresh / PASS */
  --neg:var(--red-600);                /* SELL / FAIL */
  --warn:var(--amber-700);             /* STALE / caution */
  --special:var(--violet-600);         /* BLOCKED / watch */
  --edge-hot:var(--green-600);         /* Kelly bar fill */
  --edge-glow:var(--radioactive);      /* extreme-edge text glow */

  --shadow-card:0 1px 10px rgba(15,23,42,.18);
  --shadow-cmd:0 12px 32px rgba(15,23,42,.12),0 2px 8px rgba(15,23,42,.10);
}
[data-surface="tactical"]{
  --surface-app:var(--slate-925);
  --surface-card:var(--slate-900);
  --surface-sunken:var(--slate-850);
  --surface-solid:var(--graphite-700);
  --border-dim:var(--graphite-800);
  --border-strong:var(--graphite-700);
  --border-accent:var(--cyan-400);

  --text-1:#e6edf6;
  --text-2:#8ea3bd;
  --text-inverse:#e6f6ff;
  --text-link:var(--cyan-400);

  --accent:var(--cyan-400);
  --accent-bright:var(--cyan-400);
  --pos:var(--green-400);
  --neg:var(--red-500);
  --warn:var(--amber-400);
  --special:var(--violet-500);
  --edge-hot:var(--radioactive);
  --edge-glow:var(--radioactive);

  --shadow-card:none;
  --shadow-cmd:0 12px 32px rgba(2,5,12,.5);
}

</style>
<style>

html,body{margin:0}
body{background:var(--surface-app)}
a{color:var(--text-link)}a:hover{color:var(--accent-bright)}
input[type=number]{outline:none}input[type=number]:focus{border-color:var(--accent)!important;box-shadow:var(--ring-focus)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px}
.leaflet-container{background:var(--slate-950);font-family:var(--font-sans)}
.leaflet-control-zoom a{background:rgba(9,15,26,.9)!important;color:#9fb2ca!important;border-color:#1a2740!important}
.leaflet-control-zoom a:hover{background:#132743!important;color:#fff!important}
.leaflet-control-attribution{background:rgba(4,6,12,.7)!important;color:#61789b!important;font-family:var(--font-mono);font-size:9px}
.leaflet-control-attribution a{color:#7fb2e6!important}
.mt-tt{background:#0b1220;border:1px solid #1a2740;color:#e6edf6;font-family:var(--font-mono);font-size:10px}
.mt-tt:before{display:none}

</style>

<script>
/* Derived snapshot math — pure functions over the seed at a replay frame. Keeps the
   probability axis separate from the evidence-quality (confidence) axis, always.
   Market price, model anchor, edge, Q-Kelly and the order book are all derived live
   per frame here, so every panel re-reads a coherent snapshot at the as-of cursor. */
(function buildMTX() {
  if (typeof MT === "undefined" || !window.MT) { setTimeout(buildMTX, 20); return; }
  window.MTX = (function () {
  const NF = MT.FRAMES - 1;
  function seed(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; }
  function clampF(f) { return Math.max(0, Math.min(NF, f)); }

  function tier(stormId, frame) {
    const S = MT.storms[stormId];
    const reasons = [], age = S.reconAge(frame);
    let score = 3; // 3=A 2=B 1=C
    reasons.push("Market price: SEEDED (auth-gated) → −1");
    score -= 1;
    if (age == null) { reasons.push("No recon for this basin → −1"); score -= 0.5; }
    else if (age > 30) { reasons.push("Recon stale (" + Math.round(age) + "m) → −0.5"); score -= 0.5; }
    else reasons.push("Recon fresh (" + Math.round(age) + "m) → ok");
    reasons.push("SST anomaly: manual, dated 07-22");
    reasons.push("Direct-market coverage" + (stormId === "AL04" ? "" : " via seasonal proxy"));
    const t = score >= 2.5 ? "A" : score >= 1.5 ? "B" : "C";
    return { tier: t, reasons };
  }

  function snap(stormId, frame) {
    const S = MT.storms[stormId];
    const model = S.modelCat4(frame), market = S.marketCat4(frame);
    const tt = tier(stormId, frame);
    return {
      S, frame, pressure: Math.round(S.pressure(frame)), wind: Math.round(S.wind(frame)),
      model, market, edgePct: (model - market) * 100, reconAge: S.reconAge(frame),
      tier: tt.tier, tierReasons: tt.reasons,
    };
  }

  // Live market price for a contract at a frame: base + smooth deterministic
  // micro-oscillation (order flow) + optional drift. Falls back to the storm's
  // market series when a contract has no explicit base.
  function mkt(c, frame) {
    const f = clampF(frame);
    const base = c.market != null ? c.market : MT.storms[c.storm].marketCat4(f);
    const ph = seed(c.id) * 6.283;
    const wig = Math.sin(f / 3 + ph) * 0.012 + Math.sin(f / 6.5 + ph * 2) * 0.007;
    const drift = (c.drift || 0) * (f / NF);
    return Math.max(0.02, Math.min(0.98, base + wig + drift));
  }

  // Category Alpha model anchor for a contract at a frame.
  function mdl(c, frame) {
    const f = clampF(frame);
    if (c.model != null) {
      const ph = seed(c.id + "m");
      return Math.max(0.02, Math.min(0.98, c.model + Math.sin(f / 4 + ph * 6) * 0.005 + (c.mdrift || 0) * (f / NF)));
    }
    return MT.storms[c.storm].modelCat4(f);
  }

  // Liquidity-capped Q-Kelly. Kelly fraction for a binary at price m with model
  // probability p is (p−m)/(1−m); we then apply the stake fraction and cap the
  // dollar allocation at real order-book depth.
  function kellyFor(c, frame, bankroll, stakeFrac) {
    const model = mdl(c, frame), market = mkt(c, frame);
    const edge = (model - market) * 100;
    const kf = market < 0.99 ? Math.max(0, (model - market) / (1 - market)) : 0;
    if (edge <= 0 || kf <= 0) return { edge, market: market * 100, model: model * 100, noBet: true };
    const applied = kf * stakeFrac;
    const ideal = bankroll * applied;
    const alloc = c.liquidity ? Math.min(ideal, c.liquidity) : ideal;
    return {
      edge, market: market * 100, model: model * 100,
      theoretical: applied, capped: alloc / bankroll,
      allocation: Math.round(alloc), stakePct: Math.round(applied * 100),
      rawPct: Math.round(kf * 100), liqCapped: c.liquidity && ideal > c.liquidity,
    };
  }

  // Recent price track (for market-board sparklines).
  function priceHist(c, frame, n) { const a = []; for (let i = n - 1; i >= 0; i--) a.push(mkt(c, frame - i)); return a; }

  // Per-contract order book, built live around the current mid. Depth grows away
  // from the touch; cumulative bid depth beyond c.liquidity is the slippage cap.
  function orderBookFor(c, frame) {
    const mid = mkt(c, frame), spread = c.spread || 0.02;
    const bestAsk = Math.min(0.98, mid + spread / 2), bestBid = Math.max(0.02, mid - spread / 2);
    const liq = c.liquidity || 20000;
    const depth = (i) => Math.max(1000, Math.round(liq * (0.16 + 0.17 * i) * (0.8 + seed(c.id + "d" + i) * 0.5) / 1000) * 1000);
    const asks = [0, 1, 2, 3, 4].map((i) => [Math.min(0.98, bestAsk + i * 0.02), depth(i)]);
    const bids = [0, 1, 2, 3, 4].map((i) => [Math.max(0.02, bestBid - i * 0.02), depth(i)]);
    return { contract: c.id, mid, asks, bids, bestAsk, bestBid, liquidityCap: liq, slippageBudget: Math.max(1, Math.round(spread * 100)) + "¢" };
  }

  // Bitemporal as-of accessor — engine.at(T). Returns the coherent state of the world
  // AS IT STOOD at replay frame T: interpolated eye position, recon freshness/visibility,
  // and the latest advisory issued at-or-before T. Map + tables read this one source, so
  // scrubbing rewinds geometry and latency together — not just the numbers.
  function at(stormId, frame) {
    const S = MT.storms[stormId];
    const f = clampF(frame), t = f / NF;
    const a = S.track[Math.max(0, S.pastIdx - 1)], b = S.track[S.pastIdx];
    const center = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
    const reconAge = S.reconAge(f);
    const advisory = MT.events.filter((e) => e.kind === "advisory" && e.frame <= f).slice(-1)[0] || null;
    return { S, frame: f, t, center, reconAge, reconVisible: reconAge != null, advisory, asOf: frameTime(f) };
  }

  function frameTime(frame) {
    const back = (MT.FRAMES - 1 - frame) * MT.STEP_MIN;
    const d = new Date(Date.now() - back * 60000);
    const p = (n) => (n < 10 ? "0" : "") + n;
    return p(d.getUTCHours()) + ":" + p(d.getUTCMinutes()) + "Z";
  }

  return { snap, at, kellyFor, tier, frameTime, mkt, mdl, priceHist, orderBookFor };
})();
})();

</script>

// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  // data-om-starter: inert presence marker — Claude Design's starter-usage
  // probe reads it. The closed panel renders nothing, so the marker rides
  // the <html> element as an attribute instead of a rendered node — zero
  // elements added, so page CSS (even structural selectors like
  // :nth-child) can never observe it. It records that the page WIRES a
  // tweaks panel, whether or not the panel is open. Keep this effect.
  React.useEffect(() => {
    document.documentElement.setAttribute('data-om-starter', 'tweaks-panel');
    return () => document.documentElement.removeAttribute('data-om-starter');
  }, []);

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>
<script type="text/babel">
/* Storm Command Map — Leaflet, dark tactical. A CARTO dark raster field under
   vector-first cartography: real NASA GIBS VIIRS imagery (probed live), NHC cone +
   track, recon flight track, ASCAT vectors, and multi-model consensus spread. Each
   layer carries an honest provenance tag (live / seeded / no-feed). The eye position
   is bound to the bitemporal engine (MTX.at(T)) so scrubbing rewinds geometry too. */
const MT_LAYERS = [
  { id: "satellite", label: "VIIRS Satellite", prov: "live" },
  { id: "cone", label: "NHC Cone", prov: "seeded" },
  { id: "track", label: "Forecast Track", prov: "seeded" },
  { id: "recon", label: "Recon Track", prov: "seeded" },
  { id: "ascat", label: "ASCAT Winds", prov: "seeded" },
  { id: "models", label: "Model Consensus", prov: "seeded" },
  { id: "particles", label: "Particle Wind (SFMR)", prov: "nofeed" },
];

function pad2(n) { return (n < 10 ? "0" : "") + n; }
// NASA GIBS sub-hourly GOES layers aren't retained in this environment; VIIRS/NOAA-20
// daily true-color IS, globally and reliably. Key the basemap to a recent UTC day and
// probe before attaching so an unreachable feed degrades to vector-only with no 404s.
const GIBS_SAT_LAYER = "VIIRS_NOAA20_CorrectedReflectance_TrueColor";
const GIBS_SAT_TMS = "GoogleMapsCompatible_Level9";
function gibsDay(back) {
  const d = new Date(Date.now() - back * 86400000);
  return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate());
}
function gibsUrl(date) {
  return "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/" + GIBS_SAT_LAYER +
    "/default/" + date + "/" + GIBS_SAT_TMS + "/{z}/{y}/{x}.jpg";
}
function gibsProbe(date) {
  // Probe the actual storm-region tile (z5, Gulf) rather than a global low-zoom tile,
  // so a day whose regional pass hasn't published yet is skipped cleanly (no 404 flood).
  return new Promise((res) => {
    const img = new Image();
    const to = setTimeout(() => res(false), 6000);
    img.onload = () => { clearTimeout(to); res(true); };
    img.onerror = () => { clearTimeout(to); res(false); };
    img.src = "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/" + GIBS_SAT_LAYER +
      "/default/" + date + "/" + GIBS_SAT_TMS + "/5/13/7.jpg";
  });
}
function cssVar(v) {
  const m = /var\((--[\w-]+)\)/.exec(v); if (!m) return v;
  return getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim() || "#38bdf8";
}

function MT_Map({ stormId, frame, layers, onSelect, height = "100%" }) {
  const elRef = React.useRef(null);
  const mapRef = React.useRef(null);
  const refs = React.useRef({});
  const S = MT.storms[stormId];

  // init once
  React.useEffect(() => {
    if (mapRef.current || !elRef.current || typeof L === "undefined") return;
    const map = L.map(elRef.current, { preferCanvas: true, zoomControl: false, attributionControl: true, minZoom: 2, maxZoom: 8, zoomSnap: 0.25 })
      .setView(S.center, 5);
    L.control.zoom({ position: "topright" }).addTo(map);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
      { subdomains: "abcd", maxZoom: 9, opacity: 0.62, attribution: "© OpenStreetMap · © CARTO" }).addTo(map);
    map.attributionControl.addAttribution("Imagery NASA GIBS / VIIRS · tracks NHC · SEEDED");
    refs.current.ovl = L.layerGroup().addTo(map);
    mapRef.current = map;
    setTimeout(() => map.invalidateSize(), 200);
    return () => { map.remove(); mapRef.current = null; };
  }, []);

  // recenter on storm change
  React.useEffect(() => {
    if (!mapRef.current) return;
    mapRef.current.flyTo(S.center, S.basin === "east" ? 5 : 5, { duration: 0.7 });
  }, [stormId]);

  // Satellite raster (VIIRS/NOAA-20 daily true-color via GIBS). Probe recent UTC days
  // and attach the freshest that resolves; if none do, stay vector-only silently.
  React.useEffect(() => {
    const map = mapRef.current; if (!map) return;
    if (refs.current.sat) { map.removeLayer(refs.current.sat); refs.current.sat = null; }
    if (!layers.satellite) return;
    let cancelled = false;
    (async () => {
      for (let back = 0; back < 7 && !cancelled; back++) {
        const date = gibsDay(back);
        const ok = await gibsProbe(date);
        if (cancelled || !mapRef.current) return;
        if (ok) {
          const sat = L.tileLayer(gibsUrl(date), {
            opacity: 0.9, maxNativeZoom: 8, maxZoom: 8, minZoom: 2, tileSize: 256, updateWhenIdle: true,
            attribution: "VIIRS/NOAA-20 true-color · " + date + " · NASA GIBS",
            errorTileUrl: "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" });
          sat.addTo(mapRef.current); refs.current.sat = sat;
          return;
        }
      }
    })();
    return () => { cancelled = true; };
  }, [layers.satellite]);

  // vector overlays, rebuilt on storm/layers change
  React.useEffect(() => {
    const map = mapRef.current, g = refs.current.ovl; if (!map || !g) return;
    g.clearLayers();
    const pc = cssVar(S.color);
    // all storms as selectable dots
    Object.values(MT.storms).forEach((st) => {
      const on = st.id === stormId;
      const dot = L.circleMarker(st.center, { radius: on ? 7 : 5, color: cssVar(st.color), weight: 2, fillColor: "#0b1830", fillOpacity: 1 });
      dot.on("click", () => onSelect && onSelect(st.id));
      dot.bindTooltip(st.name + " " + st.cls, { direction: "top", className: "mt-tt" });
      dot.addTo(g);
    });
    if (layers.cone && S.cone) {
      L.polygon(S.cone, { stroke: false, fillColor: pc, fillOpacity: 0.09 }).addTo(g);
      L.polygon(S.cone, { color: pc, weight: 1.1, opacity: 0.8, dashArray: "2,6", fill: false }).addTo(g);
    }
    if (layers.track && S.track) {
      const past = S.track.slice(0, S.pastIdx + 1), fut = S.track.slice(S.pastIdx);
      L.polyline(past, { color: "#e2e8f0", weight: 2, opacity: 0.9 }).addTo(g);
      L.polyline(fut, { color: "#38bdf8", weight: 1.8, opacity: 0.9, dashArray: "5,5" }).addTo(g);
      S.track.forEach((p, i) => L.circleMarker(p, { radius: 2.6, color: i <= S.pastIdx ? "#e2e8f0" : "#38bdf8", fillColor: "#0b1830", fillOpacity: 1, weight: 1.4 }).addTo(g));
    }
    if (layers.recon && S.reconTracks) {
      S.reconTracks.forEach((rt) => {
        L.polyline(rt.points, { color: rt.color, weight: 1.6, opacity: 0.9 }).addTo(g);
        const head = rt.points[rt.points.length - 1];
        L.circleMarker(head, { radius: 3.4, color: rt.color, fillColor: "#0b1830", fillOpacity: 1, weight: 1.8 })
          .bindTooltip(rt.label, { direction: "top", className: "mt-tt" }).addTo(g);
        (rt.sondes || []).forEach((p) => L.circleMarker(p, { radius: 2.2, color: rt.color, fillColor: rt.color, fillOpacity: 0.85, weight: 0 })
          .bindTooltip(rt.id + " dropsonde", { direction: "top", className: "mt-tt" }).addTo(g));
      });
    }
    if (layers.ascat) {
      // seeded surface wind vectors near the core (schematic ASCAT swath)
      const [la, lo] = S.center;
      for (let i = 0; i < 12; i++) {
        const ang = (i / 12) * Math.PI * 2, r = 1.4 + (i % 3) * 0.5;
        const p0 = [la + Math.sin(ang) * r, lo + Math.cos(ang) * r];
        const p1 = [p0[0] + Math.cos(ang + 1.4) * 0.5, p0[1] + Math.sin(ang + 1.4) * 0.5];
        L.polyline([p0, p1], { color: "#34d399", weight: 1.2, opacity: 0.7 }).addTo(g);
      }
    }
    if (layers.models && S.track) {
      const c = S.track[S.pastIdx], end = S.track[S.track.length - 1];
      MT.models.forEach((m, i) => {
        const spread = (i - 1.5) * 0.9;
        L.polyline([c, [end[0] + spread, end[1] - spread * 0.6]], { color: cssVar(m.color), weight: 1.3, opacity: 0.65, dashArray: "3,4" }).addTo(g);
      });
    }
    // eye reticle — position bound to the bitemporal engine (updated per-frame below)
    const eyeAt = (typeof MTX !== "undefined" && MTX.at) ? MTX.at(stormId, frame).center : S.center;
    const icon = L.divIcon({ className: "", iconSize: [30, 30], iconAnchor: [15, 15],
      html: '<div style="position:relative;width:30px;height:30px;color:' + pc + '">' +
        '<div style="position:absolute;inset:0;border-radius:50%;border:1.5px solid currentColor;opacity:.85;animation:ca-reticle 2.4s ease-out infinite"></div>' +
        '<div style="position:absolute;inset:8px;border-radius:50%;border:1.5px solid currentColor;opacity:.5"></div>' +
        '<div style="position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:currentColor;transform:translate(-50%,-50%);box-shadow:0 0 7px 1px currentColor"></div></div>' });
    refs.current.eye = L.marker(eyeAt, { icon, interactive: false, zIndexOffset: 1000 }).addTo(g);
  }, [stormId, layers.cone, layers.track, layers.recon, layers.ascat, layers.models]);

  // bitemporal binding — move ONLY the eye marker as the as-of cursor scrubs, so
  // geometry rewinds with the tables and there is no overlay rebuild / tile flash.
  React.useEffect(() => {
    if (!refs.current.eye || typeof MTX === "undefined" || !MTX.at) return;
    refs.current.eye.setLatLng(MTX.at(stormId, frame).center);
  }, [frame, stormId]);

  return <div ref={elRef} style={{ position: "absolute", inset: 0, height, background: "var(--slate-950)" }} />;

            <window.MT_Confidence stormId={storm} frame={frame} />
            <window.MT_Probability stormId={storm} frame={frame} />
            <window.MT_OrderBook contractId={sel.contract} frame={frame} dense={dense} />
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 14, minWidth: 0 }}>
            <window.MT_Ledger frame={frame} onSeek={(f) => { setPlaying(false); setFrame(f); }} dense={dense} />
            <window.MT_Observability />
          </div>
        </div>

        <div style={{ marginTop: 14, height: 300 }}>
          <window.MT_Console stormId={storm} frame={frame} />
        </div>
      </main>

      <window.MT_Provenance evidenceId={sel.evidence} stormId={storm} frame={frame} onClose={() => setSel((s) => ({ ...s, evidence: null }))} />

      <TweaksPanel>
        <TweakSection label="Display" />
        <TweakRadio label="Theme" value={t.theme} options={["tactical", "light"]} onChange={(v) => setTweak("theme", v)} />
        <TweakRadio label="Density" value={t.density} options={["compact", "comfortable"]} onChange={(v) => setTweak("density", v)} />
      </TweaksPanel>
    </div>
  );
}
(function mount() {
  // Order-independent boot: wait for the plain-script globals (seed data, compute
  // engine, DS bundle) before first render. Direct load has them synchronously;
  // the offline bundle re-injects scripts async, so poll briefly.
  if (window.MT && window.MTX && window.CategoryAlphaDesignSystem_a835cf && window.MT_Evidence) {
    ReactDOM.createRoot(document.getElementById("root")).render(<MillibarTerminalApp />);
  } else {
    setTimeout(mount, 30);
  }
})();

</script>
