<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Storm Atlas — Three Systems, Three Answers — 2026-09-09</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* PROSPECT PLATE — one Letter page, one idea, set as a research note rather than a dashboard.
 *
 * Reads the SAME frozen payload as print.html and changes no number, no cohort, no query point
 * and no source. print.html and snapshot.html remain the full audit versions; this is the sheet
 * a reader is handed.
 *
 * THE IDEA, and the only thing allowed to compete for attention:
 *   three atmospheric states, three legitimate Storm Atlas answers, and none of them is a
 *   probability for the live system.
 *
 * THE ORDER IS THE ARGUMENT: headline, then the map, then the three answers, then one
 * methodological sentence, then provenance. The map is dominant and each object on it is
 * coloured to the panel beneath it, so the correspondence is read rather than explained.
 *
 * TEXT IS RESIDUAL. Anything a chart already shows is cut, not restated. The density lock in
 * scripts/render-disturbance-specimen-pdf.mjs asserts it on the rendered page: 175-225 visible
 * words excluding provenance, no paragraph over two lines, three regions below the masthead,
 * one method line. A note drifts back into documentation one useful sentence at a time.
 *
 * TYPE. Source Serif 4 for the headline and deck; Public Sans for body, panel titles and
 * findings; Source Code Pro at caption size for coordinates, times, n/N, ESS and hashes only.
 * All three are pinned in fonts/ and hashed in fonts/FONTS.sha256 -- the previous sheet named
 * IBM Plex, which is not installed here, so every render had silently fallen back to Arial
 * Narrow and Helvetica. They are typography, not evidence, so they are deliberately NOT in
 * MANIFEST.json, which pins the eleven data inputs.
 */
@page { size: Letter; margin: 0.62in 0.62in 0.5in; }
:root{
  --ink:#12181f; --ink-2:#3c4854; --ink-3:#6b7885; --ink-4:#9aa5b1;
  --line:#e6eaee; --line-strong:#c3ccd5; --sunken:#fafbfc;
  --d1:#6d3fc4; --d2:#a8551a; --e14:#0a6ea8;
  --serif:"Source Serif 4",Georgia,serif;
  --sans:"Public Sans",Helvetica,Arial,sans-serif;
  --mono:"Source Code Pro",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:var(--ink);font-family:var(--sans);
          font-size:9.5pt;line-height:1.42;-webkit-font-smoothing:antialiased;height:100%}
.sheet{display:flex;flex-direction:column;min-height:100%}

/* ---- masthead ------------------------------------------------------------------------- */
.head{display:flex;justify-content:space-between;align-items:baseline;gap:24pt}
h1{font-family:var(--serif);font-size:26pt;font-weight:600;line-height:1.06;
   letter-spacing:-.008em;margin:0}
.stamp{font-family:var(--mono);font-size:7.5pt;color:var(--ink-3);white-space:nowrap;flex:0 0 auto}
.deck{font-family:var(--serif);font-size:12.5pt;line-height:1.45;color:var(--ink-2);
      margin:8pt 0 0;max-width:6.3in}
.rule{border:0;border-top:.8pt solid var(--ink);margin:9pt 0 0}

/* ---- the map ------------------------------------------------------------------------- */
.fig{margin-top:13pt}
.fig svg{display:block;width:100%;overflow:visible}
.figcap{font-size:8.5pt;line-height:1.4;color:var(--ink-3);margin:6pt 0 0;max-width:6.4in}
/* CHART TYPE IS DECLARED AT THE SIZE IT PRINTS.
   A <text> inside a viewBox is laid out in user units and then scaled by rendered-width over
   viewBox-width, so `font-size:8pt` on a map scaled UP prints far larger and on a panel chart
   scaled DOWN prints far smaller -- these labels were declared 7.5pt and printing 6.07pt.
   --k is that ratio, inverted, measured after layout; every chart size is stated as the size a
   reader actually gets. */
.gl{font-family:var(--mono);font-size:calc(8pt * var(--k,1));fill:var(--ink-3)}
.gt{font-family:var(--sans);font-size:calc(10.5pt * var(--k,1));font-weight:600}

/* ---- the three answers ----------------------------------------------------------------
   Deliberately NOT three equal columns. Each panel is as wide as its answer needs, and the
   order is the map's order: D1 west, then D2 and Fourteen-E overlapping in the east. */
.ans{display:grid;grid-template-columns:0.89fr 0.97fr 1.14fr;gap:24pt;margin-top:22pt;
     flex:0 0 auto}
/* min-width:0 because a grid item's automatic minimum is its MIN-CONTENT size, and a nowrap
   title makes that the whole title -- the tracks then grow past their fr shares and the last
   column runs off the page. The fr widths (175/224/241px) already clear what the three titles
   need (157/170/184px); the tracks just have to be allowed to take them. */
.a{display:flex;flex-direction:column;gap:6pt;min-width:0}
.tick{width:26pt;border-top:2.4pt solid var(--c)}
.atitle{font-size:11pt;font-weight:600;line-height:1.2;color:var(--ink);margin:-1pt 0 0;
        white-space:nowrap}
.atype{font-size:9pt;color:var(--ink-4);line-height:1.3;margin:-4pt 0 0}
.averdict{font-size:11pt;font-weight:600;line-height:1.3;color:var(--c);margin:1pt 0 0}
.anum{font-family:var(--mono);font-size:9pt;color:var(--ink-2);line-height:1.5;
      font-variant-numeric:tabular-nums;margin:0}
.a svg{display:block;width:100%;overflow:visible;margin-top:2pt}
.acap{font-size:9pt;line-height:1.4;color:var(--ink-3);margin:0}
.a>.acap:last-child{padding-top:2pt}
.ct{font-family:var(--mono);font-size:calc(8pt * var(--k,1));fill:var(--ink-4)}
.cv{font-family:var(--mono);font-size:calc(8pt * var(--k,1));fill:var(--ink);font-variant-numeric:tabular-nums}
.cl{font-family:var(--mono);font-size:calc(8pt * var(--k,1));fill:var(--ink-3)}

/* ---- method, then provenance ---------------------------------------------------------- */
.method{font-size:10.5pt;line-height:1.45;color:var(--ink-2);margin:0;padding-top:18pt;
        max-width:6.2in}
.method b{color:var(--ink);font-weight:600}
footer{border-top:.6pt solid var(--line-strong);margin-top:11pt;padding-top:5pt;
       font-family:var(--mono);font-size:7pt;line-height:1.5;color:var(--ink-4)}
</style></head><body><div class="sheet" id="root"></div>
<script id="payload" type="application/json">"__DATA__"</script>
<script>
const D = JSON.parse(document.getElementById("payload").textContent);
const $=(t,a,...k)=>{const e=document.createElement(t);for(const[n,v]of Object.entries(a||{})){if(v==null)continue;
 if(n==="class")e.className=v;else if(n==="html")e.innerHTML=v;else e.setAttribute(n,v);}
 for(const c of k.flat())if(c!=null)e.append(c.nodeType?c:String(c));return e;};
const NS="http://www.w3.org/2000/svg";
const S=(t,a,...k)=>{const e=document.createElementNS(NS,t);for(const[n,v]of Object.entries(a||{}))if(v!=null)e.setAttribute(n,v);
 for(const c of k.flat())if(c!=null)e.append(c.nodeType?c:String(c));return e;};
const dz=(i)=>i.slice(8,10)+"/"+i.slice(11,13)+i.slice(14,16)+"Z";

const A=D.atlas, e=D.storms.fourteenE, f=e.forecastVsAnalogs;

/* THE MAP — the one place the three systems appear together, which is what the note is about.
   Drawn ENTIRELY from the frozen payload: the two NHC outlook rings as issued, the three
   declared query cells with their 500 km radius, and Fourteen-E's own track. NO BASEMAP. A
   coastline would need a source this specimen does not pin, and an unpinned coastline on a
   plate that advertises eleven hashed inputs is exactly the quiet exception the archive exists
   to refuse. The graticule carries the geography instead.
   The science below is unchanged from the version this note replaces; only the label weights
   and the map's size moved. */
const LON0=-153.5,LON1=-108.5,LAT0=6,LAT1=24,SC=9.6;
const KX=Math.cos(((LAT0+LAT1)/2)*Math.PI/180);
const MW=(LON1-LON0)*KX*SC, MH=(LAT1-LAT0)*SC;
const mx=(lon)=>(lon-LON0)*KX*SC, my=(lat)=>(LAT1-lat)*SC;
/* 500 km on the ground, in degrees, at the cell's own latitude. Drawn as the ellipse it is. */
const KM_DEG=111.32;
function geoMap(){
  const g=S("svg",{viewBox:`0 0 ${MW} ${MH}`,role:"img","aria-label":
    "eastern and central Pacific: the two NHC outlook areas, the three query cells, "
    +"and Tropical Depression Fourteen-E's track"});
  g.append(S("rect",{x:0,y:0,width:MW,height:MH,fill:"var(--sunken)",
    stroke:"var(--line-strong)","stroke-width":.7}));
  const marks=[];
  for(let lon=-150;lon<=-110;lon+=10){
    g.append(S("line",{x1:mx(lon),x2:mx(lon),y1:0,y2:MH,stroke:"var(--line-strong)","stroke-width":.6}));
    marks.push([mx(lon),MH-3,"middle",Math.abs(lon)+"°W"]);}
  for(let lat=10;lat<=20;lat+=5){
    g.append(S("line",{x1:0,x2:MW,y1:my(lat),y2:my(lat),stroke:"var(--line-strong)","stroke-width":.6}));
    marks.push([3,my(lat)-2.5,"start",lat+"°N"]);}
  /* The outlook polygons, as NHC drew them. */
  const ring=(r)=>r.map(([la,lo])=>`${mx(lo).toFixed(1)},${my(la).toFixed(1)}`).join(" ");
  for(const[k,c]of[["d1","var(--d1)"],["d2","var(--d2)"]])
    g.append(S("polygon",{points:ring(D.gtwo[k].rings[0]),fill:c,"fill-opacity":.10,
      stroke:c,"stroke-width":1.1,"stroke-linejoin":"round"}));
  /* Fourteen-E: the tropical best track from genesis, then NHC's forecast positions. */
  g.append(S("polyline",{points:ring([[e.genesis.lat,e.genesis.lonE],[e.latestBest.lat,e.latestBest.lonE]]),
    fill:"none",stroke:"var(--e14)","stroke-width":1.6}));
  g.append(S("polyline",{points:ring([[e.latestBest.lat,e.latestBest.lonE],
    ...e.forecast.map((r)=>[r.lat,r.lonE])]),fill:"none",stroke:"var(--e14)","stroke-width":1.3,
    "stroke-dasharray":"3 2"}));
  for(const r of e.forecast)
    g.append(S("circle",{cx:mx(r.lonE),cy:my(r.lat),r:1.5,fill:"#fff",stroke:"var(--e14)","stroke-width":.9}));
  /* The three declared query cells: centre and the 500 km radius each cohort was drawn inside. */
  for(const[k,c]of[["d1","var(--d1)"],["d2","var(--d2)"],["fourteenE","var(--e14)"]]){
    const q=A[k].query,ry=(q.radiusKm/KM_DEG)*SC,rx=ry*KX/Math.cos(q.lat*Math.PI/180);
    g.append(S("ellipse",{cx:mx(q.lonE),cy:my(q.lat),rx,ry,fill:"none",stroke:c,
      "stroke-width":.9,"stroke-dasharray":"2.5 2"}));
    g.append(S("circle",{cx:mx(q.lonE),cy:my(q.lat),r:2.8,fill:c,stroke:"#fff","stroke-width":1}));}
  /* Each label carries its panel's name and its panel's colour, so the map and the three
     answers below lock together without a legend to mediate them. */
  for(const[k,lab,dx,dy,anch,c]of[["d1","D1",0,-15,"middle","var(--d1)"],
                                  ["d2","D2",-9,-17,"end","var(--d2)"],
                                  ["fourteenE","Fourteen-E",7,25,"start","var(--e14)"]]){
    const q=A[k].query;
    g.append(S("text",{x:mx(q.lonE)+dx,y:my(q.lat)+dy,"text-anchor":anch,class:"gt",
      fill:c,stroke:"#fff","stroke-width":2.6,"paint-order":"stroke"},lab));}
  for(const[x,y,anch,t]of marks)
    g.append(S("text",{x,y,"text-anchor":anch,class:"gl",stroke:"var(--sunken)","stroke-width":2.4,
      "paint-order":"stroke"},t));
  return g;
}

/* D1's chart is the gate itself: how far short the pool falls. Ten slots, three filled. */
function gate(a){
  const W=210,H=52,box=W/a.minSample,g=S("svg",{viewBox:`0 0 ${W} ${H}`,role:"img",
    "aria-label":`${a.nCases} analog storms against a sample gate of ${a.minSample}`});
  for(let i=0;i<a.minSample;i++)
    g.append(S("rect",{x:i*box+1,y:6,width:box-2,height:28,rx:2,
      fill:i<a.nCases?"var(--d1)":"#fff",stroke:i<a.nCases?"var(--d1)":"var(--line-strong)","stroke-width":.8}));
  g.append(S("text",{x:0,y:H-2,class:"cl"},a.nCases+" of "+a.minSample+" required"));
  return g;
}
/* D2's chart is what a sufficient pool supports: three thresholds, rate and interval. */
function rates(a,hue,keys){
  const W=210,rh=29,padL=34,padR=32,H=keys.length*rh+3;
  const g=S("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"share of analog storms reaching each threshold"});
  const x=(v)=>padL+(v/100)*(W-padL-padR);
  keys.forEach(([k,lab],i)=>{const o=a.levels[k],y=2+i*rh;
    g.append(S("text",{x:padL-5,y:y+15,"text-anchor":"end",class:"ct"},lab));
    g.append(S("rect",{x:padL,y:y+2,width:Math.max(1,x(o.rate)-padL),height:18,rx:2,fill:hue}));
    g.append(S("line",{x1:x(o.ci[0]),x2:x(o.ci[1]),y1:y+11,y2:y+11,stroke:"#5b6875","stroke-width":.9}));
    for(const q of o.ci)g.append(S("line",{x1:x(q),x2:x(q),y1:y+5,y2:y+18,stroke:"#5b6875","stroke-width":.9}));
    g.append(S("text",{x:W-padR+5,y:y+15,class:"cv"},o.rate.toFixed(0)+"%"));});
  return g;
}
/* Fourteen-E's chart is the only thing a formed cyclone adds: a clock both sides read on. */
function timing(a,f){
  const t=a.timeToEvent.cat1,W=210,H=84,pad=8;
  const hi=Math.max(t.p90,f.clock.elapsedHours)*1.06,x=(h)=>pad+(h/hi)*(W-pad*2),y=46;
  const g=S("svg",{viewBox:`0 0 ${W} ${H}`,role:"img",
    "aria-label":"hours from genesis to hurricane strength, historical spread and forecast"});
  for(let h=0;h<=hi;h+=48){g.append(S("line",{x1:x(h),x2:x(h),y1:22,y2:y+13,stroke:"var(--line)","stroke-width":.6}));
    g.append(S("text",{x:x(h),y:y+24,"text-anchor":"middle",class:"ct"},"+"+h+"h"));}
  g.append(S("line",{x1:x(t.p10),x2:x(t.p90),y1:y,y2:y,stroke:"var(--e14)","stroke-width":1}));
  for(const q of[t.p10,t.p90])g.append(S("line",{x1:x(q),x2:x(q),y1:y-6,y2:y+6,stroke:"var(--e14)","stroke-width":1.1}));
  g.append(S("rect",{x:x(t.p25),y:y-11,width:x(t.p75)-x(t.p25),height:22,rx:2,
    fill:"var(--e14)","fill-opacity":".20",stroke:"var(--e14)","stroke-width":.8}));
  g.append(S("line",{x1:x(t.median),x2:x(t.median),y1:y-13,y2:y+13,stroke:"var(--e14)","stroke-width":2}));
  g.append(S("text",{x:x(t.median),y:y-17,"text-anchor":"middle",class:"cv"},"median +"+t.median+"h"));
  const fx=x(f.clock.elapsedHours);
  g.append(S("line",{x1:fx,x2:fx,y1:15,y2:y+13,stroke:"var(--ink)","stroke-width":1,"stroke-dasharray":"2 1.6"}));
  g.append(S("circle",{cx:fx,cy:y,r:3,fill:"var(--ink)"}));
  g.append(S("text",{x:W-3,y:10,"text-anchor":"end",class:"cv"},"forecast +"+f.clock.elapsedHours+"h"));
  return g;
}

const r=document.getElementById("root");

r.append($("div",{class:"head"},
  $("h1",{},"Three systems, three answers"),
  $("div",{class:"stamp"},"Frozen ",D.gtwo.issued.slice(4,6),"/",D.gtwo.issued.slice(6,8),
    " ",D.gtwo.issued.slice(8,12),"Z")));
r.append($("p",{class:"deck"},
  "Three atmospheric states on one Pacific chart, and three legitimate answers from the "
  + "archive. None of them is a probability for the live system."));
r.append($("hr",{class:"rule"}));

r.append($("div",{class:"fig"},
  geoMap(),
  $("p",{class:"figcap"},`Outlook polygons as NHC issued them; dashed ring is the `
    + `${A.d1.query.radiusKm} km cell each cohort was drawn inside. No basemap.`)));

const PANELS=[
  {k:"d1", c:"var(--d1)", title:"D1 — trough SSE of Hawaiʻi",
   type:"Outlook area, no centre",
   verdict:"History too thin. Rates refused.",
   num:(a)=>`${a.nCases} storms · ESS ${a.ess.toFixed(1)} · gate ${a.minSample}`,
   chart:(a)=>gate(a),
   cap:()=>null},
  {k:"d2", c:"var(--d2)", title:"D2 — forecast formation area",
   type:"Analyst-declared reference cell",
   verdict:"Conditional rates only. No composed number.",
   num:(a)=>`${a.nCases} storms · ESS ${a.ess.toFixed(1)} · NHC ${D.gtwo.d2.pct7d}%`,
   chart:(a)=>rates(a,"var(--d2)",[["ts","TS"],["cat1","Cat 1"],["cat3","Cat 3"]]),
   cap:()=>"Given formation at this cell. Bars are 95% intervals over distinct storms."},
  {k:"fourteenE", c:"var(--e14)", title:"Fourteen-E — observed genesis",
   type:"Operationally observed genesis · ATCF",
   verdict:"Conditional rates, plus historical timing.",
   num:(a)=>`${a.nCases} storms · ESS ${a.ess.toFixed(1)} · Cat 1 ${a.levels.cat1.rate.toFixed(0)}%`,
   chart:(a)=>timing(a,f),
   cap:()=>"Hours from genesis to hurricane strength. The forecast sits inside the spread."},
];
const ans=$("div",{class:"ans"});
for(const p of PANELS){const a=A[p.k];
  ans.append($("div",{class:"a",style:`--c:${p.c}`},
    $("div",{class:"tick"}),
    $("div",{class:"atitle"},p.title),
    $("div",{class:"atype"},p.type),
    $("div",{class:"averdict"},p.verdict),
    $("p",{class:"anum"},p.num(a)),
    p.chart(a),
    p.cap(a)?$("p",{class:"acap"},p.cap(a)):null));}
r.append(ans);

/* The one methodological sentence, said once and nowhere else on the page. */
r.append($("p",{class:"method",html:
  "<b>Different conditioning events are not multiplied.</b> Storm Atlas does not turn these "
  + "frequencies into a probability for the live system."}));

/* Measure each chart's viewBox-to-pixel ratio and hand it back to the sheet as --k, so the
   sizes above are the sizes that print. Run again once webfonts land, because a metric change
   can reflow a column and move the ratio. */
function lockChartType(){
  for(const g of document.querySelectorAll("svg")){
    const vb=g.viewBox&&g.viewBox.baseVal, w=g.getBoundingClientRect().width;
    if(vb&&vb.width>0&&w>0)g.style.setProperty("--k",vb.width/w);
  }
}

r.append($("footer",{},
  `Frozen ${D.builtAt.slice(0,16).replace("T"," ")}Z · IBTrACS v04r01 · `
  + `${D.provenance.sources.length} sources SHA-256 pinned in MANIFEST.json · `
  + `Research only, not a forecast.`));
requestAnimationFrame(lockChartType);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(lockChartType);
</script></body></html>
