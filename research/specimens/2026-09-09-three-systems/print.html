cs.NA.csv","url":"https://www.ncei.noaa.gov/data/international-best-track-archive-for-climate-stewardship-ibtracs/v04r01/access/csv/ibtracs.NA.list.v04r01.csv","sha256":"1b67895f53fdfd78742bd90a585f871b5d735638aed17b6b8e91ec0befb3fff7"},{"key":"ships.EP.txt","url":"https://rammb-data.cira.colostate.edu/ships/data/EP/lsdiage_1982_2023_sat_ts_7day.txt","sha256":"d71cc4eb8641c5f5cf3e7b3774075c64d258ed7d9b10c367867bc0379e374d3d"},{"key":"ships.CP.txt","url":"https://rammb-data.cira.colostate.edu/ships/data/CP/lsdiagc_1982_2023_sat_ts_7day.txt","sha256":"443822caa9c2fb00540eb51a32ee85f9512cc43cb39c0fed374c0b228f30fe31"},{"key":"ships.AL.txt","url":"https://rammb-data.cira.colostate.edu/ships/data/AL/lsdiaga_1982_2023_sat_ts_7day.txt","sha256":"3fef6609f633f55f5f95114b88d69dd0b6f76f35264a6ce833de128ed99847c7"},{"key":"hurdat2.nepac.txt","url":"https://www.nhc.noaa.gov/data/hurdat/hurdat2-nepac-1949-2025-02272026.txt","sha256":"db65f8bc538d5c05e15f738c96111861d6ce3572c007879de58e44d4d05a9cd6"},{"key":"hurdat2.atl.txt","url":"https://www.nhc.noaa.gov/data/hurdat/hurdat2-1851-2025-02272026.txt","sha256":"1b9b0c7beed5b4505838658b1d30e159fc84330c60891a58cfcf43ae55c37202"}],"tables":[{"file":"data/genesis-archive/backtest-ledger.parquet","bytes":152308,"sha256":"c5dabb2062d8cb527e042eb4d0345f913cc848d168d604616f07940f30163893"},{"file":"data/genesis-archive/daily_disturbances.parquet","bytes":349975,"sha256":"e3f0e6efe2c4c897e27cb3d65328639303496f5e79d55cc5d066e0c1aee479a3"},{"file":"data/genesis-archive/environment.parquet","bytes":1029895,"sha256":"30fb5508f23f57ed125750c33ecf13daae6b161ba9bbe723f86d0743ded2a6d2"},{"file":"data/genesis-archive/genesis_events.parquet","bytes":239460,"sha256":"5fe9f13d72114e5f1227ead7d529a1443aabbf2335e3b61fc6915f9896a632cf"},{"file":"data/genesis-archive/landfalls.parquet","bytes":130427,"sha256":"5cfd2f722dbf375cd873cc39c0f000dcb1d689327989fea7d60ce1b19cca9f46"},{"file":"data/genesis-archive/storms.parquet","bytes":135795,"sha256":"ec45a23578d2400ab891d1a7174649b6ff1c6a4aa90df20b9628a7ac6e716689"},{"file":"data/genesis-archive/track_points.parquet","bytes":2658123,"sha256":"865d905326b1e2137867ddd0bf0159cf45599a9779ab8dbc79526546561c0b76"}]}}}</script>
<script>
const D = JSON.parse(document.getElementById("payload").textContent);
const $=(t,a,...k)=>{const e=document.createElement(t);for(const[n,v]of Object.entries(a||{})){if(v==null)continue;
 if(n==="class")e.className=v;else if(n==="html")e.innerHTML=v;else e.setAttribute(n,v);}
 for(const c of k.flat())if(c!=null)e.append(c.nodeType?c:String(c));return e;};
const NS="http://www.w3.org/2000/svg";
const S=(t,a,...k)=>{const e=document.createElementNS(NS,t);for(const[n,v]of Object.entries(a||{}))if(v!=null)e.setAttribute(n,v);
 for(const c of k.flat())if(c!=null)e.append(c.nodeType?c:String(c));return e;};
const P=(v)=>v==null?"—":v.toFixed(1)+"%";
const LV=[["td","TD"],["ts","TS"],["cat1","Cat 1"],["cat2","Cat 2"],["cat3","Cat 3"],["cat4","Cat 4"]];
const ll=(la,lo)=>`${Math.abs(la).toFixed(1)}${la<0?"S":"N"} ${Math.abs(lo).toFixed(1)}${lo<0?"W":"E"}`;
const dz=(i)=>i?i.slice(8,10)+"/"+i.slice(11,13)+i.slice(14,16)+"Z":"—";

/* Compact ladder: rate where published, count where refused. One hue, one scale. */
function ladder(a,hue){
  const W=250,rh=14,padL=30,padR=38,H=LV.length*rh+15;
  const g=S("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"analogs reaching each intensity"});
  const max=a.sufficient?100:a.nCases;
  const x=(v)=>padL+(v/max)*(W-padL-padR);
  for(const t of (a.sufficient?[0,50,100]:[0,a.nCases])){
    g.append(S("line",{x1:x(t),x2:x(t),y1:8,y2:H-5,stroke:"#e2e8f0","stroke-width":.5}));
    g.append(S("text",{x:x(t),y:5.5,"text-anchor":"middle",class:"ct"},a.sufficient?t+"%":t));}
  LV.forEach(([k,lab],i)=>{const o=a.levels[k];if(!o)return;const y=11+i*rh;
    g.append(S("text",{x:padL-3,y:y+6.5,"text-anchor":"end",class:"ct"},lab));
    const v=a.sufficient?o.rate:o.count,w=Math.max(v>0?1.2:0,x(v)-padL);
    if(w>0)g.append(S("rect",{x:padL,y,width:w,height:8,rx:1.5,fill:hue}));
    if(a.sufficient&&o.ci){const[lo,hi]=o.ci;
      g.append(S("line",{x1:x(lo),x2:x(hi),y1:y+4,y2:y+4,stroke:"#475569","stroke-width":.7}));
      for(const e of[lo,hi])g.append(S("line",{x1:x(e),x2:x(e),y1:y+1.5,y2:y+6.5,stroke:"#475569","stroke-width":.7}));}
    g.append(S("text",{x:W-padR+3,y:y+6.5,class:"cv"},a.sufficient?o.rate.toFixed(0)+"%":o.count+"/"+o.n));});
  return g;
}
/* Timing: p10–p90 whisker, p25–p75 box, median, and the forecast on the SAME clock. */
function timing(a,f){
  const t=a.timeToEvent.cat1,W=250,H=58,pad=10;
  const hi=Math.max(t.p90,f.clock.elapsedHours)*1.08,x=(h)=>pad+(h/hi)*(W-pad*2),yB=31;
  const g=S("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"hours from genesis to hurricane strength"});
  for(let h=0;h<=hi;h+=48){g.append(S("line",{x1:x(h),x2:x(h),y1:12,y2:yB+10,stroke:"#e2e8f0","stroke-width":.5}));
    g.append(S("text",{x:x(h),y:yB+18,"text-anchor":"middle",class:"ct"},"+"+h+"h"));}
  g.append(S("line",{x1:x(t.p10),x2:x(t.p90),y1:yB,y2:yB,stroke:"#0284c7","stroke-width":1}));
  for(const e of[t.p10,t.p90])g.append(S("line",{x1:x(e),x2:x(e),y1:yB-3.5,y2:yB+3.5,stroke:"#0284c7","stroke-width":1}));
  g.append(S("rect",{x:x(t.p25),y:yB-6,width:x(t.p75)-x(t.p25),height:12,rx:1.5,fill:"#0284c7","fill-opacity":".25",stroke:"#0284c7","stroke-width":.7}));
  g.append(S("line",{x1:x(t.median),x2:x(t.median),y1:yB-7,y2:yB+7,stroke:"#0284c7","stroke-width":1.6}));
  g.append(S("text",{x:x(t.median),y:yB-9.5,"text-anchor":"middle",class:"cv"},"med +"+t.median+"h"));
  const fx=x(f.clock.elapsedHours),near=fx>W-56;
  g.append(S("line",{x1:fx,x2:fx,y1:14,y2:yB+8,stroke:"#0f172a","stroke-width":.9,"stroke-dasharray":"2 1.5"}));
  g.append(S("circle",{cx:fx,cy:yB,r:2.6,fill:"#0f172a"}));
  g.append(S("text",{x:near?W:fx,y:10,"text-anchor":near?"end":"middle",class:"cv"},"forecast +"+f.clock.elapsedHours+"h"));
  return g;
}

const r=document.getElementById("root");
const e=D.storms.fourteenE,f=e.forecastVsAnalogs;

r.append($("div",{class:"top"},
  $("div",{},$("p",{class:"eyebrow"},"Storm Atlas · genesis-conditioned analogs · eastern & central Pacific"),
    $("h1",{},"Three systems, three answers")),
  $("div",{class:"frozen"},
    $("div",{},$("b",{},"FROZEN SPECIMEN")),
    $("div",{},"as of ",D.specimen.asOfLocal),
    $("div",{},"outlook ",D.gtwo.issued,"Z · forecaster ",D.outlook.forecaster))));

r.append($("p",{class:"lede",html:
  "One Pacific chart carries a trough that may become something, a low that has not formed, and a "
  + "depression that already has. The archive is asked the same question of each — <b>what did storms "
  + "born here, in September, go on to do?</b> — and gives three different kinds of answer. "
  + "<b>The most useful of them is a refusal.</b>"}));

const SY=[["d1","D1","Trough S-SE of Hawaiʻi","var(--d1)"],
          ["d2","D2","Low forecast to form","var(--d2)"],
          ["fourteenE","EP142026","TD Fourteen-E","var(--e14)"]];
const spine=$("div",{class:"spine"});
for(const[k,tag,nm,c]of SY){const a=D.atlas[k];
  spine.append($("div",{class:"sy",style:`--c:${c}`},
    $("div",{class:"t"},tag),$("div",{class:"n"},nm),
    $("div",{class:"k"},D.pointType[k]),
    $("div",{class:"v "+(a.sufficient?"yes":"no")},D.spine[k]),
    $("div",{class:"p"},`${a.nCases} analogs · ESS ${a.ess.toFixed(1)} · gate ${a.minSample}`)));}
r.append(spine);

const band=$("div",{class:"band"});

/* D1 */
{const a=D.atlas.d1;
band.append($("div",{class:"panel",style:"--c:var(--d1)"},
  $("div",{class:"hd"},$("h2",{},"D1 — the archive declines"),
    $("span",{class:"q"},ll(a.query.lat,a.query.lonE))),
  $("p",{html:`NHC gives this trough <b>${D.gtwo.d1.pct48}% / ${D.gtwo.d1.pct7d}%</b>. The pool is <b>${a.nCases} storms</b> — effective sample <b>${a.ess.toFixed(1)}</b> against a gate of ${a.minSample}. Below that line the archive publishes counts and refuses rates.`}),
  ladder(a,"var(--d1)"),
  $("p",{class:"cap"},"Counts out of the pool. No rate is drawn because none is published at this sample size."),
  $("div",{class:"qp"},$("b",{},D.queryPoints.d1.kind),D.queryPoints.d1.note)));}

/* D2 */
{const a=D.atlas.d2,c=D.composition.d2;
band.append($("div",{class:"panel",style:"--c:var(--d2)"},
  $("div",{class:"hd"},$("h2",{},"D2 — no unconditional number"),
    $("span",{class:"q"},ll(a.query.lat,a.query.lonE))),
  ladder(a,"var(--d2)"),
  $("p",{class:"cap"},`Reached each threshold, ${a.nCases} storms, 95% Wilson intervals over distinct storms. Conditional on formation under the declared reference condition.`),
  $("div",{class:"callout"},$("span",{class:"h"},"NO COMPOSED NUMBER"),c.reason),
  $("div",{class:"qp"},$("b",{},D.queryPoints.d2.kind),D.queryPoints.d2.note)));}

/* Fourteen-E */
{const a=D.atlas.fourteenE;
band.append($("div",{class:"panel",style:"--c:var(--e14)"},
  $("div",{class:"hd"},$("h2",{},"Fourteen-E — rates and timing"),
    $("span",{class:"q"},`genesis ${ll(e.genesis.lat,e.genesis.lonE)}`)),
  ladder(a,"var(--e14)"),
  $("p",{class:"cap"},`Given genesis here · ${a.nCases} storms, effective sample ${a.ess.toFixed(1)}. It has formed, so no formation chance is needed.`),
  $("div",{class:"clock"},
    $("div",{},$("span",{},"Genesis · first tropical pt"),$("b",{},dz(f.clock.genesisZ))),
    $("div",{},$("span",{},`Forecast ${f.clock.forecastKt} kt`),$("b",{},dz(f.clock.forecastValidZ))),
    $("div",{class:"o"},$("span",{},"Elapsed"),$("b",{},f.clock.elapsedHours+" h"))),
  timing(a,f),
  $("p",{class:"cap"},`Of ${f.analogHoursToCat1.n} analogs reaching Cat 1: median +${f.analogHoursToCat1.median} h, p90 +${Math.round(f.analogHoursToCat1.p90)} h. The forecast's +${f.clock.elapsedHours} h is above ${f.above.join(", ")} and below ${f.below.join(", ")}.`)));}
r.append(band);

/* Lower band — the three things a research reader needs and a summary would drop: the
   observing-era gap behind D1's pool, the correction this specimen carries, and the named
   analogs behind Fourteen-E's rates. Not marketing; the evidence. */
const low=$("div",{class:"band"});
{const all=D.atlas.d1AllEras;
low.append($("div",{class:"panel",style:"--c:var(--d1)"},
  $("div",{class:"hd"},$("h2",{},"Why D1's pool is smaller still"),$("span",{class:"q"},"all-eras gap")),
  $("p",{class:"cap"},(all.gaps[0]||"").split(". ")[0]+"."),
  $("p",{},$("b",{},`Restricting to 1971+ takes the pool from ${all.nCases} to ${D.atlas.d1.nCases}.`),
    " Both are below the gate, so the refusal stands either way.")));}
{const f=D.storms.fourteenE.forecastVsAnalogs,c=D.composition.d2;
low.append($("div",{class:"panel",style:"--c:var(--d2)"},
  $("div",{class:"hd"},$("h2",{},"What this specimen corrects"),$("span",{class:"q"},"vs. first draft")),
  $("p",{},$("b",{},"No composed probability."),
    ` An earlier draft multiplied NHC's ${c.formationPct}% by the archive's conditional rate. Withdrawn: the conditioning events are not the same event.`),
  $("p",{},$("b",{},"Clocks aligned."),
    ` Timing was measured from the ${f.clock.withdrawn.fromType} first-track fix (${f.clock.withdrawn.elapsedHours} h) against a genesis-measured cohort, and called beyond p90. Withdrawn — on the shared clock it is ${f.clock.elapsedHours} h, inside the distribution.`),
  $("p",{},$("b",{},"Points typed."),
    " An outlook centroid is an analyst-declared reference cell, not an observed genesis point.")));}
{const a=D.atlas.fourteenE;
low.append($("div",{class:"panel",style:"--c:var(--e14)"},
  $("div",{class:"hd"},$("h2",{},"Nearest analogs"),$("span",{class:"q"},"by distance from genesis")),
  $("table",{},
    $("thead",{},$("tr",{},$("th",{},"Season"),$("th",{},"Name"),$("th",{class:"n"},"km"),$("th",{class:"n"},"Peak"),$("th",{},"Landfall"))),
    $("tbody",{},a.cases.slice(0,4).map((c)=>$("tr",{},
      $("td",{class:"m"},c.season),
      $("td",{},c.name==="UNNAMED"?"unnamed":c.name),
      $("td",{class:"n"},c.km),
      $("td",{class:"n"},c.peakKt+" kt"),
      $("td",{class:"m",style:"font-size:7.5pt"},c.landfalls.length?c.landfalls.map(x=>x.region).join(", "):"—"))))),
  $("p",{class:"cap"},"Weight falls with distance from genesis; it drives the effective sample size and is not a probability.")));}
r.append(low);

const src=D.provenance.sources;
const cnt=(k)=>src.filter((s)=>s.kind===k).length;
r.append($("footer",{},
  $("div",{class:"row"},
    $("span",{},$("b",{},"REPLAY · "),`${cnt("ARCHIVED")} archived + ${cnt("CAPTURED")} captured + ${cnt("DERIVED")} derived sources, SHA-256 pinned in MANIFEST.json`),
    $("span",{},$("b",{},"ARCHIVE · "),"IBTrACS v04r01 · EP+NA · pool 1971+")),
  $("div",{class:"row",style:"margin-top:2pt"},
    $("span",{},$("b",{},"CAPTURED sources cannot be re-fetched"),' — NHC serves only the current issuance. Verify against the hash, not the live URL.')),
  $("div",{class:"row",style:"margin-top:2pt"},
    $("span",{},$("b",{},"RESEARCH ONLY · "),"Not a forecast and not advice. For live watches and warnings, NHC is the only authority. Genesis-conditioned analog frequencies are not probabilities of this season's outcome.")),
  $("div",{class:"row",style:"margin-top:2pt"},
    $("span",{},"Storm Atlas — Three Systems, Three Answers — 2026-09-09 · frozen ",D.builtAt.slice(0,16).replace("T"," "),"Z · scripts/build-disturbance-specimen.mjs"))));
</script></body></html>
