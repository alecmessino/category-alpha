name: Genesis archive — daily ingest

# Follows every NHC Tropical Weather Outlook area from first mention to its fate, and keeps
# the analog archive current.
#
# CADENCE, AND WHY IT IS NOT THE REFRESH JOB'S CADENCE. refresh-data.yml fights GitHub's
# schedule throttling with an internal 45-minute loop, because the terminal is worthless if the
# board is two hours stale. This job has the opposite requirement: NHC issues the routine
# outlook four times a day, so a cron that lands up to ~45 minutes late is simply not a problem.
# A plain daily cron is therefore correct here, and the job is idempotent -- re-running it
# appends the same observation under the same key and replaces rather than duplicating.
on:
  schedule:
    - cron: "20 5,11,17,23 * * *"   # shortly after NHC's 06/12/18/00Z outlook issuances
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild the full archive from source (slow) instead of the daily append"
        type: boolean
        default: false

# A scheduled run must never cancel a rebuild in flight; a manual run takes over.
concurrency:
  group: genesis-archive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: pip install -r scripts/genesis/requirements.txt

      # THE GATES. A data commit cannot exist unless these passed -- the same rule the
      # terminal's refresh job follows. A parser that has started inventing data must not be
      # allowed to write a row into an archive whose whole value is that it never does.
      - name: Test the archive's honesty rules
        run: python3 scripts/genesis/tests/run_tests.py

      - name: Daily ingest — outlook areas, resolution, dissipation
        if: ${{ !inputs.rebuild }}
        run: python3 scripts/genesis/cli.py daily

      - name: Full rebuild from official sources
        if: ${{ inputs.rebuild }}
        run: |
          # BOTH IBTrACS BASINS AND ALL THREE SHIPS FILES. --basins EP alone rebuilds a
          # DIFFERENT, SMALLER archive than the one committed here -- 1,712 storms instead of
          # 3,959, five sources instead of seven, and every Atlantic landfall gone -- while
          # exiting 0 and looking like a successful refresh. The rebuild flag has to reproduce
          # what is in the repository or it is a destructive operation wearing a rebuild's name.
          python3 scripts/genesis/cli.py build --basins EP,NA --ships-basins EP,CP,AL
          python3 scripts/genesis/cli.py gaps

      # The terminal reads this file same-origin; regenerating it here is what keeps the
      # board's Analog Prior panel in step with the archive it describes. It is written
      # AFTER the ingest so it reflects the disturbances this run just observed.
      - name: Regenerate the terminal's Analog Prior payload
        run: python3 scripts/genesis/cli.py emit

      # The Storm Atlas reads the archive directly in the browser, so it needs the archive as
      # column packs rather than as Parquet. Rebuilt here, after the ingest, for the same
      # reason the panel payload is.
      #
      # Each file is rewritten only when its CONTENT changes -- the pack carries a hash of the
      # tables it was built from instead of a build timestamp, so an unchanged archive produces
      # byte-identical output. That matters at this cadence: this job runs four times a day,
      # and a timestamp in the header would put a fresh megabyte of track binary into git on
      # every run for no change at all.
      - name: Rebuild the Storm Atlas packs
        run: python3 scripts/genesis/cli.py atlas-pack

      # The calibration ledger has to be rebuilt on the same cadence, and the reason is the
      # scope audit rather than the scores. The BACKTEST is not re-run here -- that is a
      # separate, expensive replay -- but the audit compares each contract's archive-wide event
      # count against what the replay observed, and the archive-wide half moves every time this
      # job appends a storm. Leaving it out would let the shipped file drift from the archive
      # it describes, and test-atlas-calibration.mjs rebuilds and byte-compares, so the drift
      # would surface as a red PR check on somebody else's unrelated change.
      - name: Rebuild the calibration ledger's scope audit
        run: python3 scripts/genesis/cli.py atlas-calibration

      # Reports rather than gates: official best-track data legitimately contains values
      # that look wrong, and refusing to commit because NOAA published something surprising
      # would make the archive less faithful. The findings land in the job log where a human
      # sees them. It DID earn its keep - it caught six landfall rows whose storm_id resolved
      # to nothing after a join change.
      - name: Validate the built archive (report)
        run: python3 scripts/genesis/tests/validate_archive.py

      - name: Commit the archive
        run: |
          git config user.name  "genesis-archive-bot"
          git config user.email "genesis-archive-bot@users.noreply.github.com"
          git add data/genesis-archive docs/data/analogs.json docs/storm-atlas/data
          if git diff --cached --quiet; then
            echo "no archive change"
            exit 0
          fi
          git commit -m "genesis: daily ingest $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          # The terminal's refresh job commits to the same branch every ten minutes, so a
          # push race here is expected rather than exceptional. Rebase and retry rather than
          # failing the run: these commits touch disjoint paths, so a rebase always applies.
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $i failed; retrying"
            sleep $((2 ** i))
          done
          echo "could not push after 4 attempts" >&2
          exit 1
