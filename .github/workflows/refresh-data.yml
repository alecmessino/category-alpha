name: Refresh Millibar Terminal data

# Pulls REAL data server-side (open internet, no browser CORS) and commits it into
# docs/data/*.json. GitHub Pages then serves the refreshed snapshot from the same
# origin the dashboard fetches — so the live URL stays permanent AND up to date.

on:
  schedule:
    # A cron fires ONCE an hour and the job then loops internally, refreshing every
    # 10 minutes. This is deliberate: GitHub throttles high-frequency schedules hard
    # — a */15 cron was measured delivering ~106 min median, so the board was
    # routinely 2h+ stale.
    #
    # The loop MUST finish before the next cron fires. That is the whole design.
    #
    # History, because this has been wrong twice: a */15 cron delivered a ~106 min
    # median. Moving to an hourly cron with a 55-min loop gave a clean 10 min inside
    # each run but 51-104 min across the hour boundary, because the cron itself lands
    # up to ~45 min late. Extending the loop to 110 min to cover that made it worse —
    # gaps of 111, 112 and once 478 minutes, sizes that track the loop length, because
    # a scheduled run that arrives while the previous one is still going gets dropped
    # rather than queued.
    #
    # That is the actual rule, and it is the one to design around: a scheduled event
    # is delivered when NOTHING is running, and dropped when something is. So the loop
    # is 45 minutes against an hourly cron, leaving ~15 minutes idle for the next
    # event to land in. Longer loops swallow their own successors.
    #
    # Self-dispatch was tried and does not work: the repository GITHUB_TOKEN cannot
    # trigger workflow runs. The API returns 204 and nothing starts, so it fails
    # silently — which is why the chain stopped dead after one loop. It is kept below
    # but gated on a user-supplied PAT, and skipped cleanly when there is not one.
    - cron: "0 * * * *"     # fires hourly; the loop below deliberately outlives the hour
  workflow_dispatch: {}       # manual "Run workflow" button
  push:
    branches: [main]          # a code push takes over immediately with the new code.
                              # the bot's own data commits carry "[skip ci]", so this never loops.

# Only a PUSH may cancel the run in flight — new code should take over at once.
#
# A scheduled run must NOT: measured over 139 refreshes and 26 hour boundaries, the
# cadence was a median of 10 min with a within-hour maximum of 11, but four boundaries
# produced 28-77 min gaps. Cause: the hourly cron cancelled a perfectly healthy loop,
# and its replacement then had to queue for a runner and clear checkout, tests and the
# claim audit before its first tick. The cron now queues behind the running loop
# instead. GitHub keeps at most one pending run per group, so this cannot pile up, and
# the 110-minute loop guarantees the successor is already waiting when it ends.
concurrency:
  group: millibar-refresh
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write             # allow the bot to commit refreshed data back to the branch
  actions: write              # allow a run to dispatch its own successor

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Offline unit test for the posterior stack (ONI parsers, phase thresholds,
      # shrinkage, refusal paths). Runs against fixtures — no network — so a broken
      # parser fails the job loudly instead of quietly degrading L3 to NO FEED.
      - name: Test posterior stack
        run: node scripts/test-enso.mjs

      # Kalshi has renamed its market fields twice. Both times the parser kept reading
      # the old names, the values degraded to zero, and the honest-degradation path
      # rendered that as "NO FEED" — so it looked like an exchange outage rather than
      # a parsing bug. This asserts the CURRENT payload shape and both previous ones.
      - name: Test market payload parsers
        run: node scripts/test-markets.mjs

      # The Tropical Weather Outlook is fixed-format text. If NHC reformats it the
      # parser would silently yield zero areas, and the terminal would go back to
      # reporting a quiet basin while systems were under watch.
      - name: Test outlook parser
        run: node scripts/test-outlook.mjs

      # Every visible claim must have a provenance owner. This fails the build if
      # capability / liveness language reappears as a literal inside a component
      # instead of as an owned claim in docs/app/claims.js. The UI drifted ahead of
      # the code three times before this existed.
      - name: Audit claim provenance
        run: node scripts/audit-claims.mjs

      - name: Refresh loop (~45 min, 10-min cadence — must end before the next cron)
        env:
          MT_STEP_MIN: "10"
        run: |
          set -u
          git config user.name  "millibar-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          END=$(( $(date +%s) + 45*60 ))
          TICK=0
          while :; do
            TICK=$((TICK+1))
            echo "::group::tick $TICK — $(date -u +%H:%MZ)"
            node scripts/fetch-data.mjs || echo "fetch failed this tick — keeping the last good snapshot"
            git add docs/data/latest.json docs/data/frames.json
            if git diff --cached --quiet; then
              echo "No data changes this tick."
            else
              git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
              for i in 1 2 3 4; do
                git push && break || { echo "push failed, retry $i"; sleep $((2 ** i)); git pull --rebase --autostash || true; }
              done
            fi
            echo "::endgroup::"
            NOW=$(date +%s)
            [ "$NOW" -ge "$END" ] && break
            REMAIN=$(( END - NOW ))
            if [ "$REMAIN" -lt 600 ]; then sleep "$REMAIN"; else sleep 600; fi
          done

      # OPTIONAL hand-off. GITHUB_TOKEN cannot trigger workflow runs — the dispatch
      # returns 204 and nothing starts — so this only does anything if a PAT with
      # `actions: write` is stored as MT_DISPATCH_TOKEN. Without one the step is
      # skipped and the hourly cron drives the chain, which is the supported path.
      # This is an upgrade, not a requirement, and it says so when it is inactive.
      - name: Dispatch the successor run (only with a PAT)
        if: success()
        env:
          PAT: ${{ secrets.MT_DISPATCH_TOKEN }}
        run: |
          if [ -z "${PAT}" ]; then
            echo "No MT_DISPATCH_TOKEN — relying on the hourly cron. This is expected."
            exit 0
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer ${PAT}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/refresh-data.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}' \
            -w "dispatch http=%{http_code}\n"
