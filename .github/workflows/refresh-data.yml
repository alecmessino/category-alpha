name: Refresh Millibar Terminal data

# Pulls REAL data server-side (open internet, no browser CORS) and commits it into
# docs/data/*.json. GitHub Pages then serves the refreshed snapshot from the same
# origin the dashboard fetches — so the live URL stays permanent AND up to date.

on:
  schedule:
    # A cron fires ONCE an hour and the job then loops internally, refreshing every
    # 10 minutes. This is deliberate: GitHub throttles high-frequency schedules hard
    # — a */15 cron was measured delivering ~106 min median, so the board was
    # routinely 2h+ stale.
    #
    # The loop runs LONGER than an hour on purpose, so the next scheduled run is
    # always already queued when this one ends. See the concurrency block below for
    # why a scheduled run must not cancel the loop it is replacing.
    - cron: "0 * * * *"     # fires hourly; the loop below deliberately outlives the hour
  workflow_dispatch: {}       # manual "Run workflow" button
  push:
    branches: [main]          # a code push takes over immediately with the new code.
                              # the bot's own data commits carry "[skip ci]", so this never loops.

# Only a PUSH may cancel the run in flight — new code should take over at once.
#
# A scheduled run must NOT: measured over 139 refreshes and 26 hour boundaries, the
# cadence was a median of 10 min with a within-hour maximum of 11, but four boundaries
# produced 28-77 min gaps. Cause: the hourly cron cancelled a perfectly healthy loop,
# and its replacement then had to queue for a runner and clear checkout, tests and the
# claim audit before its first tick. The cron now queues behind the running loop
# instead. GitHub keeps at most one pending run per group, so this cannot pile up, and
# the 110-minute loop guarantees the successor is already waiting when it ends.
concurrency:
  group: millibar-refresh
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write             # allow the bot to commit refreshed data back to the branch

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Offline unit test for the posterior stack (ONI parsers, phase thresholds,
      # shrinkage, refusal paths). Runs against fixtures — no network — so a broken
      # parser fails the job loudly instead of quietly degrading L3 to NO FEED.
      - name: Test posterior stack
        run: node scripts/test-enso.mjs

      # Every visible claim must have a provenance owner. This fails the build if
      # capability / liveness language reappears as a literal inside a component
      # instead of as an owned claim in docs/app/claims.js. The UI drifted ahead of
      # the code three times before this existed.
      - name: Audit claim provenance
        run: node scripts/audit-claims.mjs

      - name: Refresh loop (~110 min, 10-min cadence — overlaps the next hour)
        env:
          MT_STEP_MIN: "10"
        run: |
          set -u
          git config user.name  "millibar-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          END=$(( $(date +%s) + 110*60 ))
          TICK=0
          while :; do
            TICK=$((TICK+1))
            echo "::group::tick $TICK — $(date -u +%H:%MZ)"
            node scripts/fetch-data.mjs || echo "fetch failed this tick — keeping the last good snapshot"
            git add docs/data/latest.json docs/data/frames.json
            if git diff --cached --quiet; then
              echo "No data changes this tick."
            else
              git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
              for i in 1 2 3 4; do
                git push && break || { echo "push failed, retry $i"; sleep $((2 ** i)); git pull --rebase --autostash || true; }
              done
            fi
            echo "::endgroup::"
            NOW=$(date +%s)
            [ "$NOW" -ge "$END" ] && break
            REMAIN=$(( END - NOW ))
            if [ "$REMAIN" -lt 600 ]; then sleep "$REMAIN"; else sleep 600; fi
          done
