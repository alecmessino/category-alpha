name: Verify the deployed site

# Every other check in this repo tests the code or the committed files. This one
# tests the thing none of those can: that GitHub Pages is actually serving the
# current commit over the public internet, and that the page renders correctly when
# it does. It runs here because the authoring sandbox cannot reach *.github.io.
#
# This is deliberately NOT a manual step. If the deployed site breaks, the failure
# should arrive as a red build, not as something a human has to remember to check.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/verify-live.mjs"
      - ".github/workflows/verify-live.yml"
  schedule:
    - cron: "17 */6 * * *"   # four times a day, offset off the hour to avoid the refresh loop
  workflow_dispatch:
    inputs:
      url:
        description: "Override the URL to verify"
        required: false

# A newer verification supersedes one still waiting for a deploy to propagate.
concurrency:
  group: millibar-verify-live
  cancel-in-progress: true

permissions:
  contents: write             # the job commits its own verdict back to the branch

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      # The data commits land every ~10 min, so the checkout may be a few data
      # commits behind the tip. Only the app assets are byte-compared, and those
      # only change on a code push, so this is stable.
      - name: Verify the live site
        run: node scripts/verify-live.mjs --wait-min 12
        env:
          MT_LIVE_URL: ${{ github.event.inputs.url || 'https://alecmessino.github.io/category-alpha/' }}

      # The verdict goes into the repo as well as the Actions log, so the result is
      # readable over git rather than only through the API. [skip ci] keeps this from
      # re-triggering the workflow.
      - name: Commit the verification result
        if: always()
        env:
          MT_LIVE_URL: ${{ github.event.inputs.url || 'https://alecmessino.github.io/category-alpha/' }}
        run: |
          # If the verifier was killed outright (OOM, step timeout) it leaves no file,
          # and committing nothing would make a hard failure look like a quiet pass.
          # Record the absence instead.
          if [ ! -f docs/data/verify-live.json ]; then
            printf '%s\n' "{" \
              '  "schema": "millibar-verify-live/1",' \
              "  \"ranAt\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"," \
              "  \"url\": \"${MT_LIVE_URL}\"," \
              "  \"sha\": \"${GITHUB_SHA}\"," \
              "  \"runUrl\": \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"," \
              '  "ok": false, "passed": 0, "total": 0,' \
              '  "failures": [{ "check": "verifier produced no report", "detail": "the run was killed before writing a verdict — see the run log" }],' \
              '  "checks": []' \
              "}" > docs/data/verify-live.json
          fi
          git config user.name  "millibar-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/verify-live.json
          if git diff --cached --quiet; then
            echo "verification result unchanged."
          else
            git commit -m "verify: live check $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            for i in 1 2 3 4; do
              git push && break || { echo "push failed, retry $i"; sleep $((2 ** i)); git pull --rebase --autostash || true; }
            done
          fi

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-verify-screenshot
          path: live-verify.png
          if-no-files-found: ignore
          retention-days: 7
