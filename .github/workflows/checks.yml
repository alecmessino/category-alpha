name: Checks

# WHY THIS EXISTS. Every gate in this repo lived inside the data-refresh job, which only
# runs on a push to main. That was fine while main was the only branch anyone pushed to —
# and it means a PULL REQUEST RAN NOTHING. The parsers, the probability engine, the claim
# audit, the JSX check and the coverage gate all sat behind a trigger the change under
# review could not reach, so the first time a branch was tested was after it had already
# been merged.
#
# That is the wrong way round for every check here, and it is exactly backwards for the
# coverage gate, whose entire purpose is to fail a change that quietly removes the board's
# only pre-advisory inputs. A gate that cannot see a pull request cannot stop one.
#
# Everything below is OFFLINE. Every suite runs against committed fixtures, so this job
# needs no network, no secrets and no write access — which is what makes it safe to run on
# any branch and fast enough to be worth waiting for.

on:
  # BOTH TRIGGERS, DELIBERATELY, AND THE DUPLICATE RUN IS THE PRICE.
  #
  # These two together fire twice on a push to a branch with an open PR: two identical
  # runs of the same twenty steps on the same commit. That is real waste, and removing
  # the `push` trigger to stop it was tried and REVERTED, because it cost the guarantee
  # the whole file exists for.
  #
  # What happened, on f072cd2: with `pull_request` as the only trigger, the push produced
  # NO RUN AT ALL. The head commit sat with zero checks. Both earlier pushes, when `push`
  # was still listed, produced a run every time. The likeliest cause is that GitHub was
  # still recomputing refs/pull/1/merge after a merge-conflict resolution two minutes
  # earlier and skipped the synchronize — a pull_request run needs a mergeable ref, and a
  # push run does not.
  #
  # Root cause unconfirmed, and that is exactly why the belt-and-braces version is the
  # one that ships: a duplicate green run costs a runner minute, while a silently absent
  # run costs the gate. The failure modes are not comparable and should not be traded off
  # against each other.
  #
  # main is excluded from `push` because the refresh job already runs these same suites there
  # before it fetches anything -- WHICH IS TRUE OF THE TERMINAL'S SUITES AND WAS NEVER TRUE OF
  # THE ATLAS'S. refresh-data.yml runs test-calibration.mjs, the terminal ledger's gate; it runs
  # none of test-atlas-*, neither DOM check and not the benchmark. So between `branches-ignore`
  # here and `[skip ci]` on every data-refresh commit, NO ATLAS GATE HAS EVER RUN AGAINST main.
  # The drifted calibration ledger sat there unreported until a pull request happened to touch
  # the Atlas and surfaced it.
  #
  # Per-push on main is the wrong fix: the refresh loop commits roughly every ten minutes, so
  # that is ~144 full runs a day to catch a file that changes on a far slower cadence. A daily
  # scheduled run costs one and would have caught this within a day of it appearing. `schedule`
  # runs on the default branch, which is exactly the branch that had no coverage.
  pull_request:
  push:
    branches-ignore: [main]
  schedule:
    - cron: "17 6 * * *"      # 06:17 UTC daily, on main — the only thing that gates main
  workflow_dispatch: {}

# A newer push supersedes a review still in flight.
concurrency:
  group: millibar-checks-${{ github.ref }}
  cancel-in-progress: true

# Read-only on purpose. Nothing here commits, deploys or fetches.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The JSX modules are transformed in the browser — there is no build step, so
      # nothing parses them between an editor and the permanent URL. An unbalanced brace
      # does not fail anything; it renders a blank page while the pipeline underneath
      # keeps committing healthy data.
      # Both surfaces' JSX. The terminal's is transformed in the browser and the Storm Atlas's
      # is compiled by esbuild, but neither is parsed anywhere between an editor and the
      # permanent URL, and an unbalanced brace in either renders a blank page while the
      # pipeline underneath keeps committing healthy data.
      #
      # ONE npm INSTALL FOR EVERY DEV DEPENDENCY, deliberately. There is no package.json in
      # this repo, so a second `npm i --no-save` PRUNES what the first one installed -- the
      # esbuild the Atlas gate needs would vanish when the next step installed something else.
      - name: Check JSX parses
        run: |
          npm i --silent --no-fund --no-audit --no-save @babel/core @babel/preset-react esbuild@0.25.10 react@18.3.1 react-dom@18.3.1 playwright@1.49.1
          node scripts/check-jsx.mjs

      # The estimators, in the order they were built. Each checks its arithmetic against a
      # fixture whose answer is known, and — more importantly — checks every refusal path,
      # because the refusals are what keep an unanswerable question unanswered.
      - name: Test the posterior stack
        run: node scripts/test-enso.mjs
      - name: Test market payload parsers
        run: node scripts/test-markets.mjs
      - name: Test the outlook parser
        run: node scripts/test-outlook.mjs
      - name: Test basin climatologies and per-name ordinals
        run: node scripts/test-climatology.mjs
      - name: Test the edge book
        run: node scripts/test-edgebook.mjs
      - name: Test advisory ingest and per-storm anchor
        run: node scripts/test-advisory.mjs
      - name: Test the discussion parser and wrapped watch bullets
        run: node scripts/test-discussion.mjs
      - name: Test the stale-advisory crossing and the HOLD rule
        run: node scripts/test-staleness.mjs
      - name: Test the GRIB2 reader
        run: node scripts/test-grib2.mjs

      # The four pre-advisory feeds and the engine that combines them.
      - name: Test the ATCF deck parsers
        run: node scripts/test-atcf.mjs
      - name: Test the reconnaissance parser
        run: node scripts/test-recon.mjs
      - name: Test the SHIPS parser and the RI floor
        run: node scripts/test-ships.mjs
      - name: Test the probability engine
        run: node scripts/test-probability.mjs
      - name: Test the consensus-versus-recon conflict rule
        run: node scripts/test-conflict.mjs
      - name: Test that the ingested fields reach the register
        run: node scripts/test-intel-register.mjs
      - name: Test the calibration ledger and scorecard
        run: node scripts/test-calibration.mjs

      # A guard that can fail silently is not a guard. The predicate deciding whether a
      # verification run may write the verdict the board reads once disabled itself to a
      # truthy regex object and `node --check` passed it, so it is now a pure function
      # that gets MADE TO FIRE here rather than read and pronounced correct.
      - name: Test the deployment-target guard
        run: node scripts/test-deploy-target.mjs

      # The historical replay. Its zero-peek gate is the only thing standing between a
      # backtest and a confident lie, so it is asserted from both directions.
      - name: Test the backtest harness and its zero-peek gate
        run: node scripts/test-backtest.mjs

      # When each advisory actually transmitted. The gate that decides whether a recon fix
      # was still news depends entirely on this being right.
      - name: Test the advisory transmission timeline
        run: node scripts/test-advisories.mjs

      # The outlook polygons the overview map shades. A shp/dbf pairing that slips by one
      # draws a 50% probability over the wrong ocean and looks entirely normal doing it.
      - name: Test the outlook shapefile reader
        run: node scripts/test-shapefile.mjs

      # The estimator was MOVED into lib so the backtest replays the same function the board
      # trades. This compares it field-by-field against outputs captured before the move and
      # requires exact equality — a replica that drifts would score a model nobody trades.
      - name: Verify the estimator extraction is still a pure move
        run: node scripts/verify-extraction.mjs

      # Every visible claim must have a provenance owner. The UI drifted ahead of the code
      # three times before this existed, always the same way: a capability written as a
      # string literal inside a component, where no feed could contradict it.
      - name: Audit claim provenance
        run: node scripts/audit-claims.mjs

      # THE INK RULE. Two independent drafts of this surface applied HAIRLINE inks to TEXT --
      # published Wilson intervals, slot dashes and every graticule label, at 2.13-3.94:1. It is
      # not a typo but a category of mistake: an ink picked because it sat well beside a rule,
      # then reused for a sentence. So the constraint is enforced rather than reviewed.
      #
      # --self-test IS NOT DECORATION. The rule's value is entirely in its firing, and a detector
      # that silently stopped matching would leave this step green forever while checking nothing.
      # The flag seeds six real violations -- in both CSS and JSX, including one through
      # -webkit-text-fill-color and one via a token name that does not exist yet -- and requires
      # each to be caught, then seeds five LEGITIMATE uses (a hairline as a border, a mark as a
      # background, a rule token's own definition) and requires silence on all five. A guard that
      # flagged those would be switched off within a week, which is the same as not having one.
      #
      # It also pins the light shell's evidence-bar ramp, which is a DERIVED presentation table
      # and not the cartography: the plate's palette.js is authoritative and untouched.
      - name: Verify no rule, hairline or mark ink carries text
        run: node scripts/check-atlas-adherence.mjs --self-test

      # THE COVERAGE GATE, applied to the snapshot the change is asking to merge. On main
      # it runs against a snapshot the job has just fetched; here it runs against the
      # committed one, which answers a different and equally useful question: does the
      # state this branch would deploy still satisfy priorities 1 and 2?
      - name: Coverage gate — priorities 1 and 2 on the committed snapshot
        run: node scripts/check-intel-coverage.mjs

      # The genesis-analog archive is Python, and its gates are not tests of plumbing: they
      # assert the four properties that, if they broke, would let it publish a confident wrong
      # number without crashing — an interpolated value becoming an observation, a rate
      # surviving a sample that cannot support it, the zero-peek gate letting the future in,
      # and an unknown outcome being scored as a negative one.
      - name: Set up Python for the genesis archive
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the genesis archive's pinned dependencies
        run: pip install -r scripts/genesis/requirements.txt

      - name: Test the genesis archive's honesty rules
        run: python3 scripts/genesis/tests/run_tests.py

      # ------------------------------------------------------------------------------------
      # STORM ATLAS. Three gates, and they run HERE rather than with the other Node suites
      # because two of them need the archive's Python: the browser's answers are checked
      # against the archive's own, generated on the spot from the committed Parquet. Still
      # entirely offline -- no network, no secrets.

      # dist/ is committed so the permanent URL depends on no toolchain at read time. That is
      # only safe while dist/ is provably what src/ compiles to, which this rebuilds and
      # byte-compares. It catches a hand-edited bundle and a source change nobody rebuilt.
      - name: Verify the Atlas bundle is exactly what its source compiles to
        run: node scripts/test-atlas-build.mjs

      # The Atlas reads a binary built from the Parquet, and between the two sit an encoder, a
      # re-ordering and five sentinel schemes. This digests every packed column FROM THE
      # ARCHIVE and reproduces those digests FROM THE PACK, through the same accessors the
      # browser uses. A wind of 0 where the archive recorded none does not throw and does not
      # look wrong.
      - name: Verify the Atlas pack still says what the archive says
        run: node scripts/test-atlas-pack.mjs

      # THE ONE THAT MATTERS. The Atlas ships a transliteration of retrieval/analogs.py so a
      # click anywhere on the ocean can be answered without a server. That is only safe while
      # the two provably agree: 42 query vectors -- empty pools, pools below the sample gate,
      # both sides of the antimeridian, the zero-peek cutoff, the environment exclusion, the
      # subbasin distinction that keeps Iniki in a Hawaii query -- are answered by the Python
      # and then by the browser, and compared field by field. Exact where exact is possible;
      # a declared tolerance only where the platform's libm makes it unavoidable, and the
      # measured deviation is printed rather than assumed.
      - name: Verify the browser computes what the archive computes
        run: node scripts/test-atlas-parity.mjs

      # THE PLATE'S CONTEXT LAND, AND THE PROOF THAT IT IS THE ONLY THING BEHIND THE ARCHIVE'S
      # OWN GEOMETRY. The surface used to fetch its context -- South America, Africa, Canada --
      # from a third-party tile service, which every browser gate in this file ABORTS to stay
      # hermetic: the gates were measuring a plate with no context, and so was any reader behind
      # a firewall. Natural Earth 110m is packed with the archive now, and this asserts the pack
      # is the vendored TopoJSON vertex for vertex, that the committed bytes are what a fresh
      # build produces, and -- the part that keeps it true -- that no source on the plate reaches
      # for a tile host or a font CDN again.
      - name: Verify the plate's context land is vendored, and nothing fetches a tile
        run: node scripts/test-atlas-context.mjs

      # WHAT THE SHADING COUNTS, AS A NUMBER RATHER THAN AS A LABEL. Pathway counts and Genesis
      # counts are the two surfaces a shaded ocean can be read as a forecast from, so their
      # semantics are asserted against a BRUTE-FORCE count over the real archive, for the whole
      # record and for two conditioned cohorts: a storm counted once per cell it crosses and once
      # for the cell it formed in, never once per fix. It also pins the cached cell index the
      # hover readout and the brush read -- a second path to the same number, which is how a
      # readout stops being literal -- and that the renderer smooths nothing.
      - name: Verify every cell count is a literal, deduped count of storms
        run: node scripts/test-atlas-cells.mjs

      # THE PROTOTYPE'S DEMONSTRATION DATA, KEPT OUT BY NAME. This surface was redesigned against
      # a prototype carrying a hand-written table of base rates, a conditioned cohort typed as a
      # literal and a seeded random walk standing in for tracks. Every one of them renders exactly
      # like the real thing. This asserts, over the source AND the shipped bundle, that none of
      # them arrived: no demo constant, no generated population, no second refusal resolver, no
      # component dividing a count by a denominator, and no published figure as a literal.
      - name: Verify every number on the surface is the archive's
        run: node scripts/check-atlas-canonical.mjs

      # The plate draws its authoritative coastline from the archive's OWN landfall geometry, so
      # the line a reader sees is the line every landfall row was decided against. That holds only
      # while the packed copy IS that geometry: this decodes it through the browser's accessor and
      # compares EVERY vertex of EVERY ring against the GeoJSON, as a number. A simplified,
      # decimated or re-rounded coast fails here rather than shipping a map that quietly disagrees
      # with the claims drawn on top of it.
      - name: Verify the plate's coastline is the archive's coastline
        run: node scripts/test-atlas-coastlines.mjs

      # A refusal is printed as a status line and explained once, in a key at the foot of every
      # panel. That only works while the two are the same sentence -- and the wording is authored
      # in the claim registry while the code that DECIDES to refuse carries its own copy, because
      # it also runs in Node where no registry exists. Two copies of a string is a drift waiting to
      # happen; this is what makes it safe.
      - name: Verify the Epistemic Key says what the engine says
        run: node scripts/test-atlas-refusals.mjs

      # The replay skips stretches of the record where no selected storm is active, which is a
      # real distortion of pace and therefore has to be provably harmless: a linear run and a
      # skipping run over all 3,885 storms must reveal the SAME storms in the SAME order. The
      # first draft of that harness caught this build losing 11 storms -- the ones consisting of
      # a single fix, which no sampled clock can be relied on to land on.
      - name: Verify the replay clock skips dead air and nothing else
        run: node scripts/test-atlas-timeline.mjs

      # The fifth rule is NOT in the archive's Python -- it is a guard the browser adds for a
      # hazard that only exists once one cohort spec drives both the map and the statistics:
      # a variable used to define a cohort cannot be reported as an outcome of it. Two things
      # must hold at once, and the second is the dangerous one: the rule must fire, AND it must
      # be perfectly additive, because a guard that quietly perturbed a canonical result would
      # be a second methodology introduced through the back door.
      - name: Verify a cohort cannot report itself as its own outcome
        run: node scripts/test-atlas-rates.mjs

      # The map draws two things differently because of WHERE THEY CAME FROM rather than what
      # they are: a pre-genesis track portion, and a landfall the archive derived instead of
      # read. Both are justified in header comments carrying counts -- and a count in a comment
      # goes stale silently, because the archive is rebuilt about four times a day and nothing
      # recomputes the sentence. It had already happened: the pre-genesis comment said 1,580
      # against a real 9,450, and no definition of pre-genesis reproduced 1,580 at all. The rule
      # was right and only the prose was wrong, which is the failure mode this gate exists for.
      # It recomputes every stated number from the pack and fails naming the new value, and it
      # pins the structural claim underneath: genesis is the first tropical fix, so no fix
      # before it may be tropical.
      - name: Verify the map's provenance ink still describes the archive
        run: node scripts/test-atlas-provenance.mjs

      # The cohort spec is the only query surface: one object decides what is drawn AND what is
      # scored. The dangerous part was never the new code, it was the REPLACEMENT -- a rewrite
      # that silently dropped one filter would look completely healthy, because nothing on
      # screen says "provisional seasons are no longer being excluded"; the population just
      # quietly grows and every rate shifts. So the gate is an equivalence proof: for every
      # filter and a matrix of combinations, the spec path selects the identical storm set as
      # the legacy path -- plus the URL round-trip, and the archive's own warnings surviving
      # the migration, which is the half the first draft of this test forgot.
      - name: Verify one cohort spec gives one answer
        run: node scripts/test-atlas-cohort.mjs

      # Comparing two Wilson intervals for overlap is a WEAK heuristic, not a hypothesis test,
      # and this repository runs none. The danger is the vocabulary: "significant" would borrow
      # an authority the method does not have, and a reader cannot tell from a rendered page
      # which of the two a number came from. So the words of a test are banned from the sources
      # and from the shipped bundle, the two permitted statements are pinned, and the measured
      # figures behind the worked example are asserted rather than described.
      - name: Verify the comparison says only what the intervals support
        run: node scripts/test-atlas-compare.mjs

      # The environment is exposed as a LENS and not as a filter, because the coverage decides
      # the scope: under half this archive carries any environment and none of it predates 1982.
      # The three sources are sequential ERAS, and one substitutes a CLIMATOLOGICAL sea-surface
      # temperature for an observed one -- so a cohort spanning 2022 into 2023 crosses a
      # boundary where the definition of sst_c changes underneath it. This asserts there is no
      # pooled statistic anywhere in the returned object to render by accident, that the
      # boundary is announced, and that stating coverage costs none of the 991 KB block.
      - name: Verify the environment is never pooled across its source eras
        run: node scripts/test-atlas-env.mjs

      # The calibration ledger is the archive's own backtest -- 1,039 storms replayed zero-peek
      # -- projected for the browser. The file is NOT trusted because it is committed: this
      # rebuilds it from data/genesis-archive/backtest.json and compares byte for byte, the same
      # contract the pack keeps. It also pins the scope audit, which is the reason the ledger is
      # worth shipping: the refusal gate counts events ARCHIVE-WIDE, the skill that matters is
      # skill within the population a query can draw from, and of the four contracts that earned
      # no skill claim the gate catches one.
      - name: Verify the calibration ledger is the archive's own, failures included
        run: node scripts/test-atlas-calibration.mjs

      # THE ACTIVE / PROVISIONAL FRESHNESS CONTRACT.
      #
      # IBTrACS publishes a PROVISIONAL row for the running season and stops updating it long
      # before the storm stops existing. CP012026 / LALA reached the Atlas as 65 kt, Category 1,
      # 988 mb, 49 fixes -- a finished storm -- while the forecast office was still writing it up
      # nine days later at 115 kt and 947 mb. Every number on screen was a correct archive
      # column; the sentence around them, "One storm, whole life", was the bug. The ATCF b-deck
      # carrying the rest was already being fetched on the same tick and was never joined.
      #
      # This gate states the rule GENERICALLY -- for every provisional storm with a fresher
      # operational record -- and proves it against a PINNED b-deck fixture rather than against
      # production, so its verdict is the same in five years. A build that renders that fixture
      # as 65 kt / Category 1 fails here.
      - name: Verify the operational record leads where it is fresher
        run: node scripts/test-atlas-live.mjs

      # AND THAT IT GOES NOWHERE ELSE. The operational layer is a selected-storm representation
      # and must never enter cohort membership, analog matching, intensity or landfall rates,
      # Wilson intervals, ESS, calibration, the archive comparison, an event gate, a refusal or
      # zero-peek replay. The leak would be silent and attractive: scoreCases takes an untyped
      # array of plain objects and reads peak_vmax_kt off each one, so a live-aware case builder
      # would put an operational wind into a published archive rate with nothing in the way, and
      # every existing test would still pass -- they ask whether the arithmetic is right, not
      # whose numbers went into it. Two halves: the import graph, and every published historical
      # value computed with the artifact absent and again with it loaded.
      - name: Verify the operational layer never reaches the archive
        run: node scripts/test-atlas-live-boundary.mjs

      # ---- THE LALA EVENT DOSSIER ------------------------------------------------------------
      #
      # /dossier/lala is generated, not written. Its one quotable number -- "closest approach to
      # the Main Hawaiian Islands: 61 km" -- comes out of scripts/lib/geo-segment.mjs, whose
      # first draft measured to the nearest STORED COASTLINE VERTEX instead. That error is a
      # function of how finely the coastline happens to be sampled, it is always positive, and
      # nothing about it looks wrong on the page. Worse, the function's containment test can fail
      # SILENTLY: if it always answered "no", every call would quietly return the nearer endpoint
      # -- the vertex distance again, now wearing the word "segment". So the interior branch is
      # asserted to actually fire.
      - name: Verify distances are to the coastline, not to its stored vertices
        run: node scripts/test-geo-segment.mjs

      # AND THAT THE COMMITTED PAGE IS WHAT THE GENERATOR PRODUCES. The dossier is a
      # point-in-time document quoting 115 kt, 61 km, 1/26 and 141 ledger entries as facts. A
      # hand edit to index.html would make the page say something facts.json does not, and would
      # be silently reverted by the next generator run. Its b-deck, SHIPS series, ledger slice
      # and calibration state are pinned under docs/dossier/lala/data/ so a data refresh cannot
      # move them; the archive pack is not pinned, and this gate also requires the stamp the
      # masthead prints to be the stamp of the pack actually in the tree.
      # AND THAT IT IS FROZEN AGAINST AN ARCHIVE, NOT AGAINST WHATEVER PACK IS IN THE TREE.
      # The dossier used to compute from docs/storm-atlas/data/, which the genesis ingest rebuilds
      # about four times a day, and to publish that pack's stamp as its own provenance -- so the
      # artifact restamped itself on every ingest and this gate compared a frozen claim against a
      # moving target. Measured across three ingests, exactly one field moved: archive_stamp.
      # The archive bytes now live beside the dossier. These four mutations prove the two failure
      # modes stay distinct: frozen bytes that do not match their hash are an INTEGRITY failure
      # and stop the generator; a fact that moves while the source is intact is DRIFT, which the
      # generator must still emit so the byte-identity gate can name the field.
      - name: Verify the dossier is frozen against its own archive, not the live pack
        run: node scripts/test-dossier-frozen.mjs

      - name: Verify the committed dossier is byte-identical to a fresh build
        run: node scripts/check-dossier-lala.mjs

      # ---- THE COLLATERAL PACKAGE ----------------------------------------------------------
      #
      # Seven prospect-facing sheets and the manifest they are counted from. These three gates
      # are OFFLINE and read only committed bytes, so they answer the same question on any branch
      # and in five years: does every figure on a sheet trace to the manifest, does every replay
      # URL reopen the cohort it claims, and is every copy slot inside the budget its sheet was
      # laid out against.
      #
      # THE COLLATERAL IS NOT REBUILT HERE, DELIBERATELY, and that is the difference from the
      # dossier two steps above. build-collateral.mjs reads docs/data/latest.json, which the
      # refresh loop rewrites every ten minutes, so a byte-identity gate of the kind
      # check-dossier-lala.mjs runs would restamp the live line and fail on the next ingest. The
      # committed sheets are a point-in-time render corrected by an EXPLICIT freshness commit;
      # these gates check that render against its own manifest, which is a question the feed
      # cannot move. The cost is the one thing they cannot see: a source edit nobody rebuilt.
      - name: Verify every collateral figure traces to the manifest
        run: node scripts/check-collateral.mjs

      # THE LOAD-BEARING CLAIM OF THE PACKAGE IS THAT THE COHORT IS A URL, and this is the only
      # gate that tests it. Every printed replay URL is parsed back through the Atlas's own
      # parseQuery, re-executed through cohortResult against the committed pack, and compared
      # figure by figure with the row the sheet printed.
      #
      # IT IS THE ONE COLLATERAL GATE WITH A MOVING INPUT, and that is deliberate. The pack is
      # rebuilt about four times a day, so a frozen manifest is measured against a live archive
      # and a red can arrive with no pull request behind it. What bounds it is `includeProvisional`
      # defaulting to false with no collateral spec setting it: the running season cannot enter a
      # cohort, so the exposure is season FINALISATION -- when a newly non-provisional storm joins
      # a declared cell and moves an N. That failure is correct and must not be pinned away: it
      # means the printed n / N no longer reproduces, and the fix is a freshness rebuild of the
      # collateral, not a frozen copy of the archive for the gate to agree with.
      - name: Verify every replay URL reopens the cohort it claims
        run: node scripts/check-collateral-replay.mjs

      # Length was the failure mode that overflowed a sheet by 802 px with every word on it
      # correct. The budget is per slot, and a slot retired to make a sheet fit must stay retired.
      - name: Verify the collateral copy is inside its budget
        run: node scripts/check-collateral-copy-budget.mjs

  # ---- THE BROWSER GATES, IN THEIR OWN JOB -----------------------------------------------
  #
  # THEY USED TO LIVE AT THE BOTTOM OF `checks`, AND THAT IS WHY THEY STOPPED RUNNING.
  # A job runs its steps in order and stops at the first non-zero exit. These three sat below
  # `test-atlas-calibration`, so when the calibration ledger drifted -- one volatile date field,
  # nothing to do with the browser -- the job died at line 293 and the DOM checks and the
  # performance budget were never reached. Not skipped loudly: never reached, on every pull
  # request, for as long as the drift lasted. The suite reported "1 of 107 calibration checks
  # failed" and a reader had no reason to suspect three other gates had gone silent behind it.
  #
  # These gates are logically independent of every data gate above them: they load the shipped
  # pack in a real browser and assert what reaches the screen. Nothing about a calibration
  # ledger can make that question unanswerable. So they are a separate job, with no `needs`,
  # and the two run in parallel. An earlier failure can no longer suppress a later question.
  #
  # No Python here on purpose -- none of the three touches the archive's own answers.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Same single install as `checks`, and for the same reason: a second `npm i --no-save`
      # prunes the first. This job needs playwright and the Atlas's build deps.
      - name: Install dev dependencies
        run: npm i --silent --no-fund --no-audit --no-save @babel/core @babel/preset-react esbuild@0.25.10 react@18.3.1 react-dom@18.3.1 playwright@1.49.1

      #
      # These ran by hand until now, and between them they caught the two worst regressions of
      # the last phase: a crash that took the live board from 46 honesty probes to 34, and a
      # silently dropped pre-1971 observing-bias warning that every set-comparison test passed
      # straight through. A gate that only catches what the static checks miss is exactly the
      # gate that must not be optional.
      #
      # --require-browser is not decoration. All three scripts print "SKIPPED, not passed" and
      # exit 0 when playwright is absent, which is right on a laptop and catastrophic here: the
      # step would go green forever while testing nothing. The flag turns that skip into an
      # exit 2. Chromium is installed once and used by all three.
      - name: Install Chromium for the browser gates
        run: npx playwright install --with-deps chromium

      - name: Verify the honesty surface reaches the screen
        run: node scripts/check-atlas-dom.mjs --require-browser

      # THE THREE NEW SURFACE GATES LIVE HERE, NOT IN `checks`, AND THE REASON IS THE BINARY.
      # `checks` installs playwright the npm package; only this job runs `playwright install`, so
      # only this job has a Chromium to drive. Placed in `checks` they would fail on the missing
      # browser -- or, worse, be given a --require-browser flag that turns the skip into an exit 2
      # and makes the whole distinction invisible in the log.

      # THE DECK'S SEMANTICS, PER ROW. Folding six panel sections into one grid is the step where
      # a status can silently DETACH from the row it governs: in a list of blocks a refusal is
      # physically inside the thing it refuses, and in a grid every cell is a sibling of every
      # other one. A row that emits its status one cell late puts RATE REFUSED beside a real
      # percentage belonging to a different contract, and the page looks entirely normal doing it
      # -- every value on screen is one the engine really produced.
      #
      # So the deck is rendered with fixtures covering every state a row can be in, parsed in a
      # real browser rather than by regex, and audited against the four panel rules it inherited.
      # --self-test seeds eight regressions, one per rule, and requires the audit to catch each;
      # it also seeds a harmless change and requires silence. The first run of it caught two of
      # its own seeds aiming at the header row instead of a data row -- a seed that cannot fail
      # is the same problem as a rule that cannot fire.
      # The operational record was never an arithmetic bug -- every number the old panel printed
      # was a correct archive column, and what was wrong was the sentence around them. A sentence
      # is not something an engine test can see, so this drives the three source states onto a
      # real screen: the record loading and governing the storm, the record 404ing (which must
      # produce LIVE CONTINUATION UNAVAILABLE and name the instant the archive ends, never a
      # silent fall back to a stub that looks complete), and nothing being expected at all.
      # It serves the PINNED fixture in place of the committed artifact, which is rewritten every
      # ten minutes -- a gate asserting what that file contains would be asserting the weather.
      - name: Verify the operational record reaches the screen, and so does its absence
        run: node scripts/check-atlas-live-dom.mjs --require-browser

      - name: Verify every deck row carries its own status
        run: node scripts/check-evidence-deck.mjs --self-test --require-browser

      # THE BOUNDARY, READ WITHOUT READING. A cohort is defined by two kinds of condition that are
      # not interchangeable: genesis-side ones narrow the population, outcome-side ones narrow it
      # AND take the conditioned variable out of the evidence. A reader who cannot tell which side
      # a condition sits on cannot tell a finding from an artefact of their own question -- and
      # that failure passes every screenshot review, because the words are all correct and the two
      # zones simply do not look different.
      #
      # So every assertion about the boundary is made against COMPUTED STYLE with the text
      # ignored, including one that erases every word on the strip and requires the three zones to
      # remain three distinct shapes. The zones are also asserted EMPTY: an unset zone that renders
      # nothing leaves an unqueried surface with no way to show it has two sides at all.
      - name: Verify the condition boundary is legible before a word is read
        run: node scripts/check-condition-strip.mjs --self-test --require-browser

      # THE BRIDGE IS PINNED. It is the one control taking a reader from a selected storm to the
      # population it belongs to, and it used to sit at the bottom of a single scrolling column
      # beneath seven sections -- about two screens down on a 380px dock. "Present, below the
      # fold" is indistinguishable from "absent" for anyone who does not go looking.
      #
      # The gate does what a reader does: builds an inspector with more content than fits, scrolls
      # the body to its end at three content sizes, and requires the bridge to stay on screen. It
      # also asserts the body actually overflowed, because a pinning test that never scrolls
      # proves nothing.
      - name: Verify the storm-to-cohort bridge is never reachable only by scrolling
        run: node scripts/check-inspector-bridge.mjs --self-test --require-browser

      # THE PLATE'S APERTURE, BOUNDED AT BOTH ENDS. The two bounds fail at OPPOSITE viewports:
      # the 1.67 floor on a tall workstation, where a plate taller than that opens a view with a
      # research corridor off its edge; the 3.2 ceiling on a wide, short one, where a single East
      # Pacific track stops being the subject of its own plate. The second is the case nobody
      # develops at, and the specification says why it matters -- "a wide monitor will QUIETLY
      # reintroduce a panoramic plate". Nothing about a 4:1 plate looks broken.
      #
      # So the aspect is measured in the real page at eleven viewports including 2560x1080 and
      # 1440x2000, plus the docked state, and blank plane is asserted with it -- because the easy
      # way to hold an aspect bound is to cap the instrument and centre it, which is what an
      # earlier shell did and what the 0% acceptance test exists to forbid. The two FROZEN plate
      # boxes are measured with them: 834px at 1440 and 1180px at 1920, which is what a widened
      # ledger measure would move and what the retired 500px height cap used to guard.
      - name: Verify the plate's aperture stays inside its bounds
        run: node scripts/check-plate-aperture.mjs --self-test --require-browser

      # THE RESTING INSTRUMENT ITSELF, AGAINST THE FROZEN FRAME. Every other browser gate holds
      # ONE property across every state; none of them asserts the resting screen's composition,
      # and that composition is a specification with numbers in it. Six things are measured in
      # the real page at the five widths the responsive contract names: the question dominates at
      # 30px with the cohort stated once beneath it; the plate is one uninterrupted rectangle
      # whose captions are set in paper OUTSIDE the dark subtree; the Saffir-Simpson key is
      # present, in the plate's own palette, with the majors carrying extra stroke; the ledger's
      # heads and its limits are pinned at both ends of a scroll; and identity, provenance and
      # the citation are at the foot.
      #
      # THE SCALE BAR IS THE ONE THE HANDOFF SINGLES OUT, and it is checked as GEOMETRY rather
      # than as markup: the projection's own distance across the bar's rendered pixels against
      # the distance the bar claims, at every width, after a resize and after a zoom. A bar
      # stored as a constant is a measurement of a mock and is wrong on every screen that is not
      # the mock -- and it passes any check that only asks whether a bar is present.
      - name: Verify the resting instrument is the frozen frame
        run: node scripts/check-atlas-instrument.mjs --require-browser

      # AND EVERY PUBLISHED FIGURE, AGAINST A COMMITTED SNAPSHOT. The gates above assert the
      # SHAPE of the surface -- that a rate carries its interval, that a refused row says so.
      # None of them asserts the DIGITS, so a presentation change that re-rounded a rate, swapped
      # a Wilson bound for a Wald one or renamed a denominator would pass all of them while the
      # surface went on looking exactly as honest. That is the failure a layout pull request is
      # most likely to cause and least likely to notice, so the numbers are frozen as data:
      # cohort size, per-row numerator and denominator, rate, both Wilson bounds, status word,
      # refusal kind and its verbatim sentence, the pinned limits and the URL, over four states
      # chosen so every publishing path is exercised.
      - name: Verify every published figure is unchanged
        run: node scripts/check-atlas-published-values.mjs --require-browser

      # THE CAMERA, WHICH IS THE OTHER HALF OF THE APERTURE AND FAILS DIFFERENTLY.
      # The gate above measures the plate's BOX. This one measures what is IN it, and the reason
      # both exist is that the box was right throughout the bug it was written after: a contain
      # fit of a 3.19-shaped frame on a 3.84-shaped plate opened 253 degrees of longitude -- the
      # whole West Pacific and half of Asia -- on a plate captioned NORTH ATLANTIC + EAST
      # PACIFIC, at every supported viewport, with every aspect assertion passing.
      #
      # It also pins the persistence rule, which is invisible by construction: a surface that
      # quietly re-frames on every filter change looks helpful, and the cost is only paid by
      # someone doing real work -- an analyst who panned to the Gulf, added a month condition and
      # found themselves back over the mid-Atlantic. Each way the question can change is applied
      # through the surface's own controls and the camera is required not to move; HOME, FIT and
      # a storm selection are required to move it, and to remain three different answers.
      - name: Verify the camera opens on NA + EP and is never stolen by a query
        run: node scripts/check-atlas-camera.mjs --require-browser

      # THE APERTURE INVARIANT, WHICH IS WHAT THE TWO GATES ABOVE EACH SAW HALF OF.
      #
      # check-plate-aperture measures the plate's box, and every one of its measurement sites
      # opens with an EMPTY query -- it has never seen a conditioned plate. check-atlas-camera
      # asserts that a cohort edit leaves the camera alone, but establishes its premise with a
      # drag, and a pointer-originated movestart clears `atAperture` -- so the `if (wasAtAperture)`
      # branch of settle() was dead for the whole of its persistence sequence. Between them they
      # tested the box in one state and the camera in the branch that was never broken.
      #
      # What neither saw: `:has(.at-dc-vs)` widened `--at-ledger` from 33.75vw to 41vw the moment
      # the deck rendered a comparison, `--at-plate-avail` is computed from the ledger, and the
      # stage's height bounds are computed from that -- so ONE CONDITION took the plate from
      # 834x499 to 730x437 at 1440 and, because the view was still at the aperture, took the
      # camera with it: zoom 3.75 to 3.50 and the centre 3.2 degrees north at 1920, with the
      # reader's hands nowhere near the map. Every gate in this file was green throughout.
      #
      # So this one records the RECT and the CAMERA at five viewports and drives the surface's own
      # controls through every state change that is not itself a camera command -- each condition
      # type, the comparison column, a refusal, the duration columns, the editor, the transport --
      # and requires both back identical. It is deliberately blind to everything INSIDE the
      # ledger: the status leaving its track and the outcome column taking the slack are the
      # ledger rearranging its own contents and are none of the aperture's business.
      #
      # --self-test IS NOT DECORATION, for the same reason it is not on the adherence gate. Once
      # the surface is stable this step prints nothing but ok forever, and a detector that quietly
      # stopped detecting would look exactly the same. It seeds a 60px ledger widening -- which is
      # precisely the shape of the defect it was written for -- and fails if that goes unnoticed.
      - name: Verify the plate's box and camera survive every non-camera state change
        run: node scripts/check-atlas-stability.mjs --self-test --require-browser

      # THE REAL-STATE MATRIX. Every layout bug this integration produced was invisible in the
      # state it was introduced in and obvious two states later: the plate measured 0x0 only once
      # it was inside a single-cell row; the rows came out shifted only once a transport existed
      # to claim row 3; the qualification block was missing only when NOTHING refused -- which is
      # the unqueried archive, the state a developer looks at least.
      #
      # So the surface is driven through twenty-two real states and the same invariants asserted
      # in all of them. Coverage is DETECTED AND REPORTED rather than assumed: whether a cohort
      # contains a BASE RATE ONLY contract depends on the archive and not on the query, so the
      # harness records which refusals and statuses it actually reached and fails if any of the
      # four refusal kinds went unvisited. A matrix that silently never reached a refusal proves
      # nothing about refusals.
      - name: Verify every real state holds, and 1440x900 answers five of five
        run: node scripts/check-atlas-states.mjs --require-browser

      # THE ACCEPTANCE CRITERION ITSELF, MEASURED RATHER THAN REVIEWED. Eight things on screen at
      # the same time at 1920x1080, with nothing scrolled and nothing opened -- the question, the
      # conditions, a focused map, the cohort size, the WHOLE intensity ladder, a rate with its
      # Wilson interval in one cell, the archive comparison or its status where applicable, and
      # the first material qualification. Driven at 1600x900 and 1440x900 as well, since a layout
      # that answers eight of eight only on the largest monitor has answered a different
      # question. The type floor is asserted alongside them: fitting all eight by dropping the
      # interval a size would satisfy the letter of the criterion and break the sentence under it.
      - name: Verify all eight are on screen at first paint
        run: node scripts/check-atlas-acceptance.mjs --require-browser

      # THE APPROVED VISUAL CONTRACT, MEASURED FRAME BY FRAME. Six frames fixed the composition --
      # the split between plate and answer at 1920 and 1440, one declared band both columns
      # terminate in, eight findings above the fold, the matrix in the page's own scroll, the
      # comparison as stamp-size copy rather than a second masthead, and a pointer line carrying
      # one fact -- and the instruction that came with them was that the gates follow the frames.
      # Every number in this gate is read off one; where the surface and a frame disagree, the
      # frame is what fails the run. Seeded, so a rule that stops measuring is caught rather than
      # reported as another silent pass.
      - name: Verify the surface holds the approved visual contract
        run: node scripts/check-atlas-contract.mjs --self-test --require-browser

      # THE VISUAL RESPONSIVE MATRIX. The state matrix above drives many states at ONE width and
      # asserts what must be true of the ANSWER. This one drives five states at EVERY width the
      # ladder names and asserts what must be true of the SURFACE -- nothing clipped without a
      # way to read it, no qualification hidden, no row whose cells fall onto two grid lines, and
      # an inspector whose pinned bridge survives a viewport narrow enough to lift the dock off
      # the plate row. Three of those four had already happened once in this integration.
      #
      # It also asserts that the ladder STEPS: the fold state is read at each width and compared
      # with the one the specification names, so a boundary that moved shows up as the wrong
      # column count rather than as a layout that merely still fits.
      # EVERY WORD ON EVERY SURFACE, IN BOTH SHELLS, AGAINST THE GROUND IT ACTUALLY LANDS ON.
      # The adherence gate enumerates the light shell's TOKEN TABLE, and that is exactly why it
      # missed a storm name shipped at 1.07:1: the inspector's masthead used a literal written
      # when the only chrome was near-black, and a rule that reads tokens cannot see a literal.
      # The same hole ran the other way -- the provenance drawer kept a hard-coded dark ground
      # under the light shell's near-black inks. This gate reads no stylesheet: it opens the six
      # real surfaces and measures the contrast the browser resolved, with SVG text taken from
      # `fill` rather than `color`, in the light shell and the dark one.
      - name: Verify every word clears AA on the ground it lands on, in both shells
        run: node scripts/check-light-contrast.mjs --require-browser

      - name: Verify every state holds at every breakpoint the ladder names
        run: node scripts/check-responsive-matrix.mjs --require-browser

      # MAP ↔ EVIDENCE, AS ONE CLAIM. Holding a row of the answer draws THAT ROW'S storms on the
      # plate, and the lens is the one place a published NUMBER and a set of drawn TRACKS claim to
      # be the same thing. Three ways that can be false and a screenshot shows none of them: the
      # set could be re-derived by the renderer (asserted numerically, row by row, against the
      # numerator the ladder printed), the hold could publish (the URL, the question, the cohort
      # and every figure are captured either side and required identical), or it could fail to
      # come back (release is asserted as an exact restore of the plate, the camera and the
      # drawn population).
      - name: Verify the plate lifts exactly what the answer counted
        run: node scripts/check-atlas-lens.mjs --require-browser

      # AND THAT THE INSTRUMENT ANSWERS WITHOUT A POINTER. The primary gesture of this surface is
      # a click on the ocean; every word on the page was already reachable by keyboard and the one
      # thing the page is FOR was not. The reticle turns the arrows into a crosshair -- Leaflet's
      # pan is given back on Escape -- and this drives it with keys alone: Tab reaches every
      # control and each is named, aria-pressed tracks every held state, the arrows move the
      # crosshair while the map stays still, the literal cell count follows it, a polite live
      # region says what is under it, and Enter does exactly what a click does.
      - name: Verify the instrument answers the keyboard
        run: node scripts/check-atlas-a11y.mjs --require-browser

      - name: Verify the terminal's panels refuse on screen, not just in the engine
        run: node scripts/check-panel-dom.mjs --require-browser

      # --ci scales the WALL-CLOCK budgets x3 and says so in its output; byte budgets are not
      # scaled. The budgets were measured on a development container and a shared runner is a
      # noisier machine, so the choice is between a declared multiplier and a gate that gets
      # quietly loosened until it catches nothing. A 10x regression still trips a 3x budget.
      - name: Verify the Atlas still meets its performance budgets
        run: node scripts/bench-atlas.mjs --ci --require-browser

      # ---- THE COLLATERAL SHEETS, MEASURED -------------------------------------------------
      #
      # A sheet that overflows its page or drops a label below its type floor is a print defect
      # nothing static can see: the markup is valid, every number is right, and the PDF is two
      # pages. The fit gate releases each sheet's clamped height to measure the real content
      # against the page, and demands 8 px of headroom because a sheet measured at exactly zero
      # printed as two; the type gate classifies every node by what it IS -- legal, citation,
      # table, body -- and holds each class to its own floor, so a sheet cannot be made to fit by
      # shrinking the sentence that qualifies it.
      #
      # THEY ARE HERE AND NOT IN `checks` FOR THE REASON STATED AT THE TOP OF THIS JOB: only this
      # job runs `playwright install`, so only this job has a Chromium to drive. They reuse the
      # one installed above and add no second browser.
      #
      # --require-browser is not decoration here either. Both scripts print a skip and exit 0
      # when playwright is absent, which is right on a laptop and would be a step green forever
      # while measuring nothing. The flag turns that skip into an exit 2.
      - name: Verify every collateral sheet fits its page
        run: node scripts/check-collateral-fit.mjs --require-browser

      - name: Verify every collateral class clears its type floor
        run: node scripts/check-collateral-legibility.mjs --require-browser

  # ---- THE ONE REQUIRED CHECK ------------------------------------------------------------
  #
  # Splitting the gates into parallel jobs buys independence and costs a single verdict: a
  # branch-protection rule naming `checks` would now go green while `browser` burned. This job
  # exists to put that verdict back. It needs both, runs even when they fail (`always()`), and
  # fails if either did -- so there is still exactly one status to require, and it cannot be
  # satisfied by a job that never ran.
  #
  # `result` is checked explicitly rather than trusting the default: a SKIPPED dependency is
  # not a passing one, and `always()` makes skipping reachable.
  required:
    if: always()
    needs: [checks, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Every gate group reported success
        run: |
          echo "checks=${{ needs.checks.result }}  browser=${{ needs.browser.result }}"
          [ "${{ needs.checks.result }}" = "success" ] || { echo "::error::the checks job did not succeed"; exit 1; }
          [ "${{ needs.browser.result }}" = "success" ] || { echo "::error::the browser job did not succeed"; exit 1; }
          echo "all gate groups green"
