name: Checks

# WHY THIS EXISTS. Every gate in this repo lived inside the data-refresh job, which only
# runs on a push to main. That was fine while main was the only branch anyone pushed to —
# and it means a PULL REQUEST RAN NOTHING. The parsers, the probability engine, the claim
# audit, the JSX check and the coverage gate all sat behind a trigger the change under
# review could not reach, so the first time a branch was tested was after it had already
# been merged.
#
# That is the wrong way round for every check here, and it is exactly backwards for the
# coverage gate, whose entire purpose is to fail a change that quietly removes the board's
# only pre-advisory inputs. A gate that cannot see a pull request cannot stop one.
#
# Everything below is OFFLINE. Every suite runs against committed fixtures, so this job
# needs no network, no secrets and no write access — which is what makes it safe to run on
# any branch and fast enough to be worth waiting for.

on:
  # BOTH TRIGGERS, DELIBERATELY, AND THE DUPLICATE RUN IS THE PRICE.
  #
  # These two together fire twice on a push to a branch with an open PR: two identical
  # runs of the same twenty steps on the same commit. That is real waste, and removing
  # the `push` trigger to stop it was tried and REVERTED, because it cost the guarantee
  # the whole file exists for.
  #
  # What happened, on f072cd2: with `pull_request` as the only trigger, the push produced
  # NO RUN AT ALL. The head commit sat with zero checks. Both earlier pushes, when `push`
  # was still listed, produced a run every time. The likeliest cause is that GitHub was
  # still recomputing refs/pull/1/merge after a merge-conflict resolution two minutes
  # earlier and skipped the synchronize — a pull_request run needs a mergeable ref, and a
  # push run does not.
  #
  # Root cause unconfirmed, and that is exactly why the belt-and-braces version is the
  # one that ships: a duplicate green run costs a runner minute, while a silently absent
  # run costs the gate. The failure modes are not comparable and should not be traded off
  # against each other.
  #
  # main is excluded because the refresh job already runs these same suites there before
  # it fetches anything.
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch: {}

# A newer push supersedes a review still in flight.
concurrency:
  group: millibar-checks-${{ github.ref }}
  cancel-in-progress: true

# Read-only on purpose. Nothing here commits, deploys or fetches.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The JSX modules are transformed in the browser — there is no build step, so
      # nothing parses them between an editor and the permanent URL. An unbalanced brace
      # does not fail anything; it renders a blank page while the pipeline underneath
      # keeps committing healthy data.
      # Both surfaces' JSX. The terminal's is transformed in the browser and the Storm Atlas's
      # is compiled by esbuild, but neither is parsed anywhere between an editor and the
      # permanent URL, and an unbalanced brace in either renders a blank page while the
      # pipeline underneath keeps committing healthy data.
      #
      # ONE npm INSTALL FOR EVERY DEV DEPENDENCY, deliberately. There is no package.json in
      # this repo, so a second `npm i --no-save` PRUNES what the first one installed -- the
      # esbuild the Atlas gate needs would vanish when the next step installed something else.
      - name: Check JSX parses
        run: |
          npm i --silent --no-fund --no-audit --no-save @babel/core @babel/preset-react esbuild@0.25.10 react@18.3.1 react-dom@18.3.1
          node scripts/check-jsx.mjs

      # The estimators, in the order they were built. Each checks its arithmetic against a
      # fixture whose answer is known, and — more importantly — checks every refusal path,
      # because the refusals are what keep an unanswerable question unanswered.
      - name: Test the posterior stack
        run: node scripts/test-enso.mjs
      - name: Test market payload parsers
        run: node scripts/test-markets.mjs
      - name: Test the outlook parser
        run: node scripts/test-outlook.mjs
      - name: Test basin climatologies and per-name ordinals
        run: node scripts/test-climatology.mjs
      - name: Test the edge book
        run: node scripts/test-edgebook.mjs
      - name: Test advisory ingest and per-storm anchor
        run: node scripts/test-advisory.mjs
      - name: Test the discussion parser and wrapped watch bullets
        run: node scripts/test-discussion.mjs
      - name: Test the stale-advisory crossing and the HOLD rule
        run: node scripts/test-staleness.mjs
      - name: Test the GRIB2 reader
        run: node scripts/test-grib2.mjs

      # The four pre-advisory feeds and the engine that combines them.
      - name: Test the ATCF deck parsers
        run: node scripts/test-atcf.mjs
      - name: Test the reconnaissance parser
        run: node scripts/test-recon.mjs
      - name: Test the SHIPS parser and the RI floor
        run: node scripts/test-ships.mjs
      - name: Test the probability engine
        run: node scripts/test-probability.mjs
      - name: Test the consensus-versus-recon conflict rule
        run: node scripts/test-conflict.mjs
      - name: Test that the ingested fields reach the register
        run: node scripts/test-intel-register.mjs
      - name: Test the calibration ledger and scorecard
        run: node scripts/test-calibration.mjs

      # A guard that can fail silently is not a guard. The predicate deciding whether a
      # verification run may write the verdict the board reads once disabled itself to a
      # truthy regex object and `node --check` passed it, so it is now a pure function
      # that gets MADE TO FIRE here rather than read and pronounced correct.
      - name: Test the deployment-target guard
        run: node scripts/test-deploy-target.mjs

      # The historical replay. Its zero-peek gate is the only thing standing between a
      # backtest and a confident lie, so it is asserted from both directions.
      - name: Test the backtest harness and its zero-peek gate
        run: node scripts/test-backtest.mjs

      # When each advisory actually transmitted. The gate that decides whether a recon fix
      # was still news depends entirely on this being right.
      - name: Test the advisory transmission timeline
        run: node scripts/test-advisories.mjs

      # The outlook polygons the overview map shades. A shp/dbf pairing that slips by one
      # draws a 50% probability over the wrong ocean and looks entirely normal doing it.
      - name: Test the outlook shapefile reader
        run: node scripts/test-shapefile.mjs

      # The estimator was MOVED into lib so the backtest replays the same function the board
      # trades. This compares it field-by-field against outputs captured before the move and
      # requires exact equality — a replica that drifts would score a model nobody trades.
      - name: Verify the estimator extraction is still a pure move
        run: node scripts/verify-extraction.mjs

      # Every visible claim must have a provenance owner. The UI drifted ahead of the code
      # three times before this existed, always the same way: a capability written as a
      # string literal inside a component, where no feed could contradict it.
      - name: Audit claim provenance
        run: node scripts/audit-claims.mjs

      # THE COVERAGE GATE, applied to the snapshot the change is asking to merge. On main
      # it runs against a snapshot the job has just fetched; here it runs against the
      # committed one, which answers a different and equally useful question: does the
      # state this branch would deploy still satisfy priorities 1 and 2?
      - name: Coverage gate — priorities 1 and 2 on the committed snapshot
        run: node scripts/check-intel-coverage.mjs

      # The genesis-analog archive is Python, and its gates are not tests of plumbing: they
      # assert the four properties that, if they broke, would let it publish a confident wrong
      # number without crashing — an interpolated value becoming an observation, a rate
      # surviving a sample that cannot support it, the zero-peek gate letting the future in,
      # and an unknown outcome being scored as a negative one.
      - name: Set up Python for the genesis archive
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the genesis archive's pinned dependencies
        run: pip install -r scripts/genesis/requirements.txt

      - name: Test the genesis archive's honesty rules
        run: python3 scripts/genesis/tests/run_tests.py

      # ------------------------------------------------------------------------------------
      # STORM ATLAS. Three gates, and they run HERE rather than with the other Node suites
      # because two of them need the archive's Python: the browser's answers are checked
      # against the archive's own, generated on the spot from the committed Parquet. Still
      # entirely offline -- no network, no secrets.

      # dist/ is committed so the permanent URL depends on no toolchain at read time. That is
      # only safe while dist/ is provably what src/ compiles to, which this rebuilds and
      # byte-compares. It catches a hand-edited bundle and a source change nobody rebuilt.
      - name: Verify the Atlas bundle is exactly what its source compiles to
        run: node scripts/test-atlas-build.mjs

      # The Atlas reads a binary built from the Parquet, and between the two sit an encoder, a
      # re-ordering and five sentinel schemes. This digests every packed column FROM THE
      # ARCHIVE and reproduces those digests FROM THE PACK, through the same accessors the
      # browser uses. A wind of 0 where the archive recorded none does not throw and does not
      # look wrong.
      - name: Verify the Atlas pack still says what the archive says
        run: node scripts/test-atlas-pack.mjs

      # THE ONE THAT MATTERS. The Atlas ships a transliteration of retrieval/analogs.py so a
      # click anywhere on the ocean can be answered without a server. That is only safe while
      # the two provably agree: 42 query vectors -- empty pools, pools below the sample gate,
      # both sides of the antimeridian, the zero-peek cutoff, the environment exclusion, the
      # subbasin distinction that keeps Iniki in a Hawaii query -- are answered by the Python
      # and then by the browser, and compared field by field. Exact where exact is possible;
      # a declared tolerance only where the platform's libm makes it unavoidable, and the
      # measured deviation is printed rather than assumed.
      - name: Verify the browser computes what the archive computes
        run: node scripts/test-atlas-parity.mjs
